<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JS Imóveis">
<meta name="theme-color" content="#14161B">
<title>CRM Imobiliário · Josimar Souza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* ====== CORES DA MARCA — altere aqui ====== */
:root{ /* Tema PREMIUM (por defeito): grafite + champanhe */
  --navy:#14161B; --navy2:#1D2027; --navy3:#30343D;
  --gold:#C2A26B; --gold2:#E2CB9C;
  --onacc:#14161B;   /* texto sobre a cor de destaque */
  --hl:#E2CB9C;      /* números/realces sobre fundo escuro */
  --cream:#F3EEE5; --ink:#17191E; --muted:#7D776C; --line:#E8E2D7; --bg:#F8F6F1; --card:#FFFFFF;
  --red:#A8323B; --redbg:#F6E4E2; --redline:#E9C4C0;
  --green:#3D7558; --blue:#3E5C7C;
  --fh:'Playfair Display',Georgia,serif; --fhw:600; --fhls:0;
  --shadow:0 1px 2px rgba(20,22,27,.04),0 6px 20px rgba(20,22,27,.05);
}
body.t-classico{ /* azul-marinho + dourado (versão anterior) */
  --navy:#0E1A2C; --navy2:#18263D; --navy3:#22324F;
  --gold:#D4AF6A; --gold2:#F0B26E; --onacc:#0E1A2C; --hl:#D4AF6A;
  --cream:#F6EFE4; --ink:#1B2433; --muted:#6B7385; --line:#E6DFD2; --bg:#F8F5EF;
  --red:#C2453B; --redbg:#FBE3E0; --redline:#EFC7C2; --green:#2F8A5B; --blue:#2D6CB5;
}
body.t-marca{ /* carvão + vermelho dos posts */
  --navy:#232428; --navy2:#2C2D32; --navy3:#3A3B41;
  --gold:#D70B35; --gold2:#FF6B84; --onacc:#FFFFFF; --hl:#FFFFFF;
  --cream:#F3F3F4; --ink:#1E1F23; --muted:#6B6E76; --line:#E3E3E6; --bg:#F5F5F6;
  --red:#D70B35; --redbg:#FCE1E6; --redline:#F3B9C4; --green:#2F8A5B; --blue:#2D6CB5;
  --fh:Inter,-apple-system,system-ui,sans-serif; --fhw:800; --fhls:-.02em;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:16px}
header{background:var(--navy);color:var(--cream);padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--gold);font-family:var(--fh);display:flex;align-items:center;justify-content:center;color:var(--onacc);font-size:16px;font-weight:800;letter-spacing:-.02em}
.brand h1{margin:0;font-family:var(--fh);font-size:20px;font-weight:var(--fhw);letter-spacing:var(--fhls);line-height:1.1;color:#fff}
.brand small{display:block;color:#C9CACD;font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
.hdr-btn{margin-left:auto;background:transparent;border:1px solid var(--navy3);color:var(--cream);border-radius:10px;padding:8px 10px;font-size:13px}
main{padding:16px 16px calc(env(safe-area-inset-bottom) + 90px);max-width:820px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:30;border-top:1px solid var(--navy3)}
nav button{flex:1;background:none;border:0;color:#9AA4B8;font-size:11px;font-weight:600;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.03em}
nav button .ic{display:block}
nav button{min-width:0;font-size:10.5px}
nav button.on{color:var(--hl);box-shadow:inset 0 2px 0 var(--gold)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 78px);width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--onacc);border:0;font-size:30px;font-weight:500;box-shadow:0 6px 18px rgba(14,26,44,.35);z-index:31}
h2{font-family:var(--fh);font-weight:var(--fhw);letter-spacing:var(--fhls);font-size:25px;margin:4px 0 12px;color:var(--navy)}
h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.stats{display:flex;gap:10px;margin-bottom:6px}
.stat{flex:1;background:linear-gradient(160deg,var(--navy2),var(--navy));color:var(--cream);border-radius:16px;padding:13px;border:1px solid var(--navy3)}
.stat b{display:block;font-size:26px;color:var(--hl);font-weight:var(--fhw);letter-spacing:var(--fhls);font-family:var(--fh)}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#B9C1D0}
.stat.alert b{color:#FF9B8F}
.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:13px 14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--navy);color:var(--hl);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--cream);color:var(--navy);margin-right:4px;margin-top:6px}
.tag.gold{background:var(--gold);color:var(--onacc)}
.tag.red{background:var(--redbg);color:var(--red)}
.tag.green{background:#DFF1E7;color:var(--green)}
.tag.blue{background:#E1ECF8;color:var(--blue)}
.when{font-size:12.5px;font-weight:600;color:var(--navy);text-align:right;white-space:nowrap}
.when.late{color:var(--red)}
.when.today{color:var(--navy);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--gold);color:var(--onacc);border-color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;background:var(--navy);color:var(--cream)}
.btn.gold{background:var(--gold);color:var(--onacc)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.red{background:#fff;color:var(--red);border:1px solid var(--redline)}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,32,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);-webkit-overflow-scrolling:touch}
.sheet-h{display:flex;align-items:center;margin-bottom:10px}
.sheet-h h2{margin:0;flex:1}
.x{background:none;border:0;font-size:26px;color:var(--muted);padding:0 4px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px;letter-spacing:.04em;text-transform:uppercase}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
textarea{min-height:76px;resize:vertical}
.g2{display:flex;gap:10px}.g2>div{flex:1;min-width:0}
.box{background:var(--navy);color:var(--cream);border-radius:14px;padding:12px 14px;margin-top:16px}
.box label{color:#C9CACD}
.box input,.box select,.box textarea{border-color:var(--navy3)}
.req{color:var(--gold2);font-size:12px;margin-top:4px}
.qa{display:flex;gap:8px;margin:12px 0}
.qa a,.qa button{flex:1;text-align:center;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;color:var(--navy);font-weight:600;font-size:13px}
.qa .ic{display:block;font-size:20px;margin-bottom:2px}
.hist{border-left:2px solid var(--gold);padding:2px 0 2px 12px;margin:8px 0}
.hist b{font-size:12px;color:var(--muted);font-weight:600}
.ap{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.ap.done{opacity:.55}
.ap .t{font-weight:700;color:var(--navy)}
.cal-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fab2{display:flex;align-items:center;justify-content:center;position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom) + 146px);width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;border:1.5px solid var(--gold);font-size:22px;box-shadow:0 6px 18px rgba(14,26,44,.3);z-index:31}
#cloud{font-size:15px;margin-left:auto;cursor:pointer}
#cloud+.hdr-btn{margin-left:8px}
.spin{text-align:center;padding:34px 10px;color:var(--navy);font-weight:600}
.rec{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
details summary{font-weight:600;color:var(--navy)}
.cmp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cmp .hd{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--navy)}
.cmp input[type=checkbox]{width:20px;height:20px;-webkit-appearance:checkbox;appearance:auto;padding:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);background:var(--navy);color:#fff;border-left:4px solid var(--gold);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;z-index:80;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.pipe-col{margin-bottom:14px}
.pipe-h{border:1px solid var(--navy3);display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:var(--cream);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px}
.pipe-h span{background:var(--gold);color:var(--onacc);border-radius:20px;padding:1px 9px;font-size:12px}
.pipe-col .card{margin:6px 0 0}
.day-h{font-weight:700;color:var(--navy);margin:16px 0 6px;font-size:14px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">JS</div>
    <div>
      <h1>Josimar Souza</h1>
      <small>Consultor Imobiliário · Imotrust</small>
    </div>
    <span id="cloud" onclick="go('mais')"></span>
    <button class="hdr-btn" onclick="openCalendarMenu()" style="display:flex;align-items:center;gap:6px"><svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Agenda</button>
  </div>
</header>

<main id="view"></main>

<button class="fab2" onclick="openAudio()" aria-label="Nota de áudio"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></button>
<button class="fab" onclick="fabAdd()">+</button>

<nav>
  <button data-v="hoje" class="on" onclick="go('hoje')"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoje</button>
  <button data-v="contactos" onclick="go('contactos')"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.5 3.5 5.2"/></svg>Contactos</button>
  <button data-v="imoveis" onclick="go('imoveis')"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5.5h4V20"/></svg>Imóveis</button>
  <button data-v="pipeline" onclick="go('pipeline')"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Pipeline</button>
  <button data-v="agenda" onclick="go('agenda')"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Agenda</button>
  <button data-v="mais" onclick="go('mais')"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Mais</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ES5 apenas — compatível com Safari iOS antigo */
var KEY = 'crm_imob_v1';
var TIPOS = ['Comprador','Proprietário (venda)','Senhorio (arrendar)','Arrendatário','Investidor','Parceiro'];
var ORIGENS = ['OLX','Idealista','Indicação','Cartas / porta-a-porta','Instagram','Placa / Montra','Imotrust','Outro'];
var ESTADOS = ['Novo','Contactado','Qualificado','Reunião / Visita marcada','Avaliação / Proposta','Angariado / Fechado','Nutrir','Perdido'];
var FECHADOS = ['Angariado / Fechado','Perdido'];
var ACOES = ['Ligar','WhatsApp','Visita','Reunião de angariação','Avaliação do imóvel','Enviar imóveis','Follow-up','Assinatura CMI / CPCV','Escritura'];
var ZONAS = ['Alfragide','Amadora','Oeiras','Queluz','Prior Velho','Cascais','Lisboa','Outra'];

var TEMAS=[['premium','Premium · grafite e champanhe','#14161B'],['classico','Clássico · azul e dourado','#0E1A2C'],['marca','Marca · carvão e vermelho','#232428']];
function temaAtual(){ var t='premium'; try{ t=localStorage.getItem('crm_theme')||'premium'; }catch(e){} return t; }
function aplicaTema(t){
  document.body.className = t==='premium' ? '' : 't-'+t;
  for(var i=0;i<TEMAS.length;i++){ if(TEMAS[i][0]===t){ var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',TEMAS[i][2]); } }
}
function setTema(t){ try{ localStorage.setItem('crm_theme',t); }catch(e){} aplicaTema(t); render(); }
aplicaTema(temaAtual());
var db = load(); db.imoveis=db.imoveis||[];
var cur = 'hoje';
var filtro = {q:'', tipo:'Todos', estado:'Todos'};

function load(){
  try{ var s = localStorage.getItem(KEY); if(s){ return JSON.parse(s); } }catch(e){}
  return seed();
}
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Erro ao guardar!'); }
}
function save(c){ // c = contacto alterado (marca-o para sincronizar)
  if(c) c.upd=Date.now();
  saveLocal(); scheduleSync();
}
function uid(){ return 'c' + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function pad(n){ return (n<10?'0':'') + n; }
function nowLocal(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function addDays(n, h){ var d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+(h||'10:00'); }
function parseL(s){ // 'YYYY-MM-DDTHH:MM' -> Date local (Safari não aceita bem new Date(s))
  if(!s) return null; var p=s.split('T'); var d=p[0].split('-'); var t=(p[1]||'00:00').split(':');
  return new Date(+d[0], +d[1]-1, +d[2], +t[0], +t[1]);
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(n){ var p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?').charAt(0) + (p.length>1?p[p.length-1].charAt(0):'')).toUpperCase(); }
var DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmt(s){
  var d=parseL(s); if(!d) return '—';
  var hoje=new Date(); hoje.setHours(0,0,0,0);
  var dd=new Date(d.getTime()); dd.setHours(0,0,0,0);
  var diff=Math.round((dd-hoje)/86400000);
  var h=pad(d.getHours())+':'+pad(d.getMinutes());
  if(diff===0) return 'Hoje '+h;
  if(diff===1) return 'Amanhã '+h;
  if(diff===-1) return 'Ontem '+h;
  return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]+' · '+h;
}
function dayLabel(d){ return DIAS[d.getDay()]+', '+d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear(); }
function whenClass(s){
  var d=parseL(s); if(!d) return ''; var n=new Date();
  if(d<n) return 'late';
  if(d.toDateString()===n.toDateString()) return 'today';
  return '';
}
function isClosed(c){ return FECHADOS.indexOf(c.estado)>-1; }
function nextAp(c){
  var best=null;
  for(var i=0;i<(c.ag||[]).length;i++){ var a=c.ag[i]; if(!a.feito && (!best || a.d<best.d)) best=a; }
  return best;
}
function semAg(c){ return !isClosed(c) && !nextAp(c); }
function byId(id){ for(var i=0;i<db.contacts.length;i++){ if(db.contacts[i].id===id) return db.contacts[i]; } return null; }
function toast(t){ var e=document.getElementById('toast'); e.innerHTML=esc(t); e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){e.style.display='none';},2200); }
function tagTipo(t){
  var cls = t==='Comprador'||t==='Arrendatário'||t==='Investidor' ? 'blue' : (t==='Parceiro'?'':'gold');
  return '<span class="tag '+cls+'">'+esc(t)+'</span>';
}
function tagEstado(e){
  var cls = e==='Angariado / Fechado' ? 'green' : (e==='Perdido' ? 'red' : '');
  return '<span class="tag '+cls+'">'+esc(e)+'</span>';
}

function seed(){ return {contacts:[], imoveis:[]}; }

/* ---------- Navegação ---------- */
function go(v){
  cur=v;
  var bs=document.querySelectorAll('nav button');
  for(var i=0;i<bs.length;i++){ bs[i].className = bs[i].getAttribute('data-v')===v ? 'on' : ''; }
  render(); window.scrollTo(0,0);
}
function render(){
  var h='';
  if(cur==='hoje') h=vHoje();
  else if(cur==='contactos') h=vContactos();
  else if(cur==='pipeline') h=vPipeline();
  else if(cur==='agenda') h=vAgenda();
  else if(cur==='olx') h=vOlx();
  else if(cur==='ang') h=vAng();
  else if(cur==='imoveis') h=vImoveis();
  else if(cur==='num') h=vNum();
  else if(cur==='mercado') h=vMercado();
  else h=vMais();

/* ---------- HOJE ---------- */
function vHoje(){
  var now=new Date(); var fimHoje=new Date(); fimHoje.setHours(23,59,59,999);
  var atrasados=[], hoje=[], semana=[], sem=[];
  var fim7=new Date(); fim7.setDate(fim7.getDate()+7);
  var ativos=0;
  for(var i=0;i<db.contacts.length;i++){
    var c=db.contacts[i]; if(!isClosed(c)) ativos++;
    if(semAg(c)){ sem.push(c); continue; }
    var a=nextAp(c); if(!a) continue; var d=parseL(a.d);
    if(d<now && d.toDateString()!==now.toDateString()) atrasados.push(c);
    else if(d<=fimHoje) hoje.push(c);
    else if(d<=fim7) semana.push(c);
  }
  function srt(arr){ arr.sort(function(x,y){ return nextAp(x).d<nextAp(y).d?-1:1; }); return arr; }
  srt(atrasados); srt(hoje); srt(semana);
  var hr=new Date().getHours();
  var h='<h2>'+(hr<12?'Bom dia':(hr<20?'Boa tarde':'Boa noite'))+', Josimar</h2>';
  h+='<div class="stats"><div class="stat"><b>'+hoje.length+'</b><span>Hoje</span></div>'+
     '<div class="stat '+(atrasados.length?'alert':'')+'"><b>'+atrasados.length+'</b><span>Atrasados</span></div>'+
     '<div class="stat"><b>'+ativos+'</b><span>Ativos</span></div></div>';
  var ct=contratosAlerta();
  if(ct.length){ h+='<h3 style="color:var(--red)">📄 Contratos a terminar ('+ct.length+')</h3>'; for(i=0;i<ct.length;i++) h+=angCard(ct[i]); }
  if(sem.length){ h+='<h3 style="color:var(--red)">⚠️ Sem agendamento ('+sem.length+')</h3>'; for(i=0;i<sem.length;i++) h+=contactCard(sem[i]); }
  if(atrasados.length){ h+='<h3 style="color:var(--red)">Atrasados</h3>'; for(i=0;i<atrasados.length;i++) h+=contactCard(atrasados[i]); }
  h+='<h3>Hoje</h3>';
  if(hoje.length){ for(i=0;i<hoje.length;i++) h+=contactCard(hoje[i]); } else h+='<div class="empty">Nada marcado para hoje.</div>';
  if(semana.length){ h+='<h3>Próximos 7 dias</h3>'; for(i=0;i<semana.length;i++) h+=contactCard(semana[i]); }
  return h;
}

function htmlLista(){
  var q=filtro.q.toLowerCase(); var out=[];

    var c=db.contacts[i];
    if(filtro.tipo!=='Todos' && c.tipo!==filtro.tipo) continue;
    if(filtro.estado!=='Todos' && c.estado!==filtro.estado) continue;
    if(q){ var s=(c.nome+' '+c.tel+' '+c.email+' '+c.zona+' '+c.interesse+' '+c.notas+' '+c.origem).toLowerCase(); if(s.indexOf(q)<0) continue; }

  var h='<div class="note" style="margin-bottom:8px">'+out.length+' contacto(s)</div>';

function telNorm(t){
  var d=String(t||'').replace(/[^\d+]/g,'');
  if(!d) return '';
  if(d.charAt(0)==='+') return d.substring(1);
  if(d.indexOf('00')===0) return d.substring(2);
  if(d.length===9) return '351'+d;
  return d;
}

  if(!isClosed(c) && !nextAp(c)){ toast('Marque o próximo passo'); newAp(id, true); } else openContact(id);

function addHist(id){
  var t=v('htxt'); if(!t){ toast('Escreva a interação'); return; }

  save(c); openContact(id); toast('Interação registada');

function delContact(id){
  if(!confirm('Apagar este contacto definitivamente?')) return;
  for(var i=0;i<db.contacts.length;i++){ if(db.contacts[i].id===id){ db.contacts.splice(i,1); break; } }
  db.del=db.del||[]; db.del.push({id:id, upd:Date.now()});
  save(null); closeModal(); render(); toast('Contacto apagado');
}

function download(text, name, type){

  var url=(window.URL||window.webkitURL).createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=name; a.target='_blank';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); (window.URL||window.webkitURL).revokeObjectURL(url); }, 1500);
}

function xhr(method, url, headers, body, cb){

function withToken(cb){

      else if(st===0){ cb(null); }

    });
}

/* ---------- Sincronização (o mais recente ganha, contacto a contacto) ---------- */
function scheduleSync(){
  if(!sess) return;
  clearTimeout(syncT); syncT=setTimeout(function(){ sync(false); }, 1500);
}
function rowOf(c){ return {id:c.id, data:c, upd:c.upd||0, deleted:false}; }
function idxIn(arr,id){ for(var i=0;i<arr.length;i++){ if(arr[i].id===id) return i; } return -1; }
function idxOf(id){ return idxIn(db.contacts,id); }
function syncEnd(ok, manual){
  syncing=false;
  if(ok){ lastSync=new Date(); setCloud('ok'); if(manual) toast('Sincronizado'); }
  else { setCloud('err'); if(manual) toast('Falha na sincronização'); }
  if(cur==='mais' && sess) render();
  if(syncAgain){ syncAgain=false; scheduleSync(); }
}
var COLS=[{t:'crm_contacts',k:'contacts',d:'del'},{t:'crm_imoveis',k:'imoveis',d:'delI'}];
function syncOne(col, cb){
  rest('GET','/rest/v1/'+col.t+'?select=id,data,upd,deleted',null,null,function(st,rows){
    if(st!==200 || !rows || typeof rows.length!=='number'){ cb(false,false); return; }
    var arr=db[col.k]=db[col.k]||[], dl=db[col.d]=db[col.d]||[];
    var i, changed=false, push=[], remote={}, delMap={};
    for(i=0;i<rows.length;i++) remote[rows[i].id]=rows[i];
    for(i=0;i<dl.length;i++) delMap[dl[i].id]=dl[i].upd;
    if(col.k==='contacts' && rows.length){
      for(i=arr.length-1;i>=0;i--){ var sd=arr[i]; if(String(sd.id).indexOf('seed-')===0 && sd.upd===1 && !remote[sd.id]){ arr.splice(i,1); changed=true; } }
    }
    for(var id in remote){ if(!remote.hasOwnProperty(id)) continue;
      var r=remote[id], li=idxIn(arr,id), l=li>-1?arr[li]:null, ru=Number(r.upd)||0;
      if(delMap[id]!==undefined){
        if(r.deleted || delMap[id]>=ru){ if(!r.deleted) push.push({id:id,data:{},upd:delMap[id],deleted:true}); continue; }
      }
      if(r.deleted){
        if(l && (l.upd||0)<=ru){ arr.splice(li,1); changed=true; }
        else if(l) push.push(rowOf(l));
        continue;
      }
      if(!l){ r.data.id=id; r.data.upd=ru; arr.push(r.data); changed=true; }
      else if(ru>(l.upd||0)){ r.data.id=id; r.data.upd=ru; arr[li]=r.data; changed=true; }
      else if((l.upd||0)>ru) push.push(rowOf(l));
    }
    for(i=0;i<arr.length;i++){ if(!remote[arr[i].id]) push.push(rowOf(arr[i])); }
    if(!push.length){ db[col.d]=[]; cb(true,changed); return; }
    rest('POST','/rest/v1/'+col.t+'?on_conflict=id',JSON.stringify(push),'resolution=merge-duplicates,return=minimal',function(st2){
      var ok=st2>=200 && st2<300; if(ok) db[col.d]=[]; cb(ok,changed);
    });
  });
}
function sync(manual){
  if(!sess){ if(manual) toast('Entre na conta primeiro'); return; }
  if(syncing){ syncAgain=true; return; }
  syncing=true; setCloud('busy');
  var n=0, allOk=true, anyCh=false;
  function step(){
    if(n>=COLS.length){
      saveLocal();
      if(anyCh && document.getElementById('modal').className.indexOf('open')<0) render();
      syncEnd(allOk, manual); return;
    }
    syncOne(COLS[n++], function(ok,ch){ if(!ok) allOk=false; if(ch) anyCh=true; step(); });
  }
  step();
}

var ANG_EST=['Ativa','Vendido','Terminada'];
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dDate(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function dFmt(s){ var d=dDate(s); return d? d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear() : '—'; }
function diasAte(s){ var d=dDate(s); if(!d) return null; var h=new Date(); h.setHours(0,0,0,0); return Math.round((d-h)/86400000); }
function addMeses(s,n){ var d=dDate(s); if(!d) return ''; var dia=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); var ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(dia,ult)); d.setDate(d.getDate()-1); return ymd(d); }
function eur(n){ return Math.round(Number(n)||0).toLocaleString('pt-PT')+' €'; }
function comAg(a){ return (Number(a.preco)||0)*(Number(a.pct)||0)/100; }
function comMinha(a){ var c=comAg(a); return a.minha!==''&&a.minha!=null&&!isNaN(Number(a.minha)) ? c*Number(a.minha)/100 : c; }

function angCalc(soValor){
  if(!soValor){ var m=v('gmes'); if(m!=='Outra' && v('gini')) document.getElementById('gfim').value=addMeses(v('gini'),+m); }
  var a={preco:v('gpre'), pct:v('gpct'), minha:v('gmin')}, r=document.getElementById('gres'); if(!r) return;

function findAg(c,id){ if(!id) return null; for(var i=0;i<(c.ag||[]).length;i++){ if(c.ag[i].id===id) return c.ag[i]; } return null; }
function dropRenov(c){
  var a=c.ang; if(!a||!a.agId) return;
  for(var i=0;i<(c.ag||[]).length;i++){ if(c.ag[i].id===a.agId && !c.ag[i].feito){ c.ag.splice(i,1); break; } }
  a.agId=null;
}
function syncRenov(c){
  var a=c.ang; c.ag=c.ag||[];
  if(a.estado!=='Ativa' || !a.fim){ dropRenov(c); return null; }
  var d=dDate(a.fim); d.setDate(d.getDate()-15);
  var amanha=new Date(); amanha.setDate(amanha.getDate()+1); amanha.setHours(0,0,0,0);
  if(diasAte(a.fim)<0){ d=amanha; } else if(d<amanha){ d=amanha; }
  var when=ymd(d)+'T10:00', nota='Renovar contrato de angariação (termina a '+dFmt(a.fim)+')';
  var ap=findAg(c,a.agId);
  if(ap && !ap.feito){ ap.d=when; ap.nota=nota; return ap; }
  ap={id:uid(), d:when, tipo:'Follow-up', nota:nota, feito:false}; c.ag.push(ap); a.agId=ap.id; return ap;
}
function angSave(cid){

  if(fim<ini){ toast('O fim tem de ser depois do início'); return; }
  var novo=!c.ang, old=c.ang||{};
  c.ang={estado:v('gest'), excl:v('gexc')==='Exclusivo', ini:ini, fim:fim, meses:v('gmes'), preco:v('gpre'), pct:v('gpct'), minha:v('gmin'), nota:v('gnot'), agId:old.agId||null, vendidoEm:old.vendidoEm||null};

  if(c.ang.estado!=='Terminada') c.estado='Angariado / Fechado';
  var ap=syncRenov(c);

function angVendido(cid){

function angDel(cid){

function vAng(){
  var at=[], vd=[], tm=[], i, c, prev=0, ano=0, y=String(new Date().getFullYear()), ex=0;
  for(i=0;i<db.contacts.length;i++){ c=db.contacts[i]; if(!c.ang) continue;
    if(c.ang.estado==='Ativa'){ at.push(c); prev+=comMinha(c.ang); if(c.ang.excl) ex++; }
    else if(c.ang.estado==='Vendido'){ vd.push(c); if(String(c.ang.vendidoEm||'').indexOf(y)===0) ano+=comMinha(c.ang); }
    else tm.push(c); }
  at.sort(function(a,b){ return a.ang.fim<b.ang.fim?-1:1; });
  vd.sort(function(a,b){ return (a.ang.vendidoEm||'')>(b.ang.vendidoEm||'')?-1:1; });
  var h='<h2>Contratos e comissões</h2>';
  h+='<div class="stats"><div class="stat"><b>'+at.length+'</b><span>Ativas · '+ex+' excl.</span></div><div class="stat"><b style="font-size:19px">'+eur(prev)+'</b><span>Prevista</span></div><div class="stat"><b style="font-size:19px">'+eur(ano)+'</b><span>Vendido '+y+'</span></div></div>';
  h+='<div class="note">Valores sem IVA. Se indicar “a minha parte (%)” num contrato, conta só a sua parte; senão conta a comissão total.</div>';
  h+='<h3>Ativas</h3>'; if(!at.length) h+='<div class="empty">Ainda não há contratos ativos. Registe-os na ficha de cada proprietário.</div>';
  for(i=0;i<at.length;i++) h+=angCard(at[i]);
  if(vd.length){ h+='<h3>Vendidas</h3>'; for(i=0;i<vd.length;i++) h+=angCard(vd[i]); }
  if(tm.length){ h+='<h3>Terminadas</h3>'; for(i=0;i<tm.length;i++) h+=angCard(tm[i]); }
  return h;
}

function matchImv(m, c){

function imvSnap(){ imvInit={}; for(var i=0;i<IMV_IDS.length;i++){ var e=document.getElementById(IMV_IDS[i]); if(e) imvInit[IMV_IDS[i]]=e.value; } }

function setIf(id, val){
  if(val===null || val===undefined || val==='') return false;
  var e=document.getElementById(id); if(!e) return false;
  if(e.value!==(imvInit[id]||'') && e.value!=='') return false; // o utilizador já mexeu: não sobrepor
  e.value=String(val); imvInit[id]=e.value;

function fillFromLink(useText){
  if(filling) return;
  var url=v('ilink'), txt=useText?v('iadtxt'):'';
  if(useText && txt.length<40){ toast('Cole o texto do anúncio'); return; }
  if(!useText && !/^https?:\/\//.test(url)){ toast('Cole primeiro o link do anúncio'); return; }
  if(!sess){ toast('Entre na conta para usar a IA'); return; }
  filling=true; lastFillUrl=url;
  var b=document.getElementById('ifill'); if(b) b.innerHTML='⏳ A ler o anúncio…';
  withToken(function(t){
    if(!t){ filling=false; if(b) b.innerHTML='✨ Preencher automaticamente pelo link'; toast('Sem ligação / sessão'); return; }
    xhr('POST', SB_URL+'/functions/v1/imovel-link', {apikey:SB_KEY, Authorization:'Bearer '+t, 'Content-Type':'application/json'}, JSON.stringify(useText?{url:url,text:txt}:{url:url}), function(st,j){
      filling=false; if(b) b.innerHTML='✨ Preencher automaticamente pelo link';
      if(!document.getElementById('ilink')) return;
      var blk=document.getElementById('iblk');
      if(st===200 && j && j.error==='bloqueado'){
        if(blk){ blk.style.display='block'; document.getElementById('iblkmsg').innerHTML='O site '+esc(j.host||'')+' não deixa ler o anúncio automaticamente. Abra o anúncio, selecione e copie o texto, e cole aqui:'; }
        toast('Este site bloqueia a leitura — cole o texto'); return;
      }
      if(st!==200 || !j || j.error){
        var e=j&&j.error; toast(e==='sem_chave'?'A IA ainda não está ativada':(e==='url'?'Link inválido':(st===0?'Sem ligação à internet':'Não foi possível ler o anúncio'))); return;
      }
      var f=[], cur=v('iorig');
      if(setIf('itit', j.titulo)) f.push('título');
      if(setIf('ineg', j.negocio)) f.push(j.negocio.toLowerCase());
      if(setIf('itipo', j.tipo)) f.push(j.tipo.toLowerCase());
      if(j.quartos!==null && setIf('iqt', String(j.quartos))) f.push('T'+j.quartos);
      if(setIf('ipre', j.preco)) f.push('preço');
      if(setIf('iarea', j.area)) f.push(j.area+' m²');
      if(j.zona && j.zona!=='Outra' && setIf('izona', j.zona)) f.push(j.zona);
      if(setIf('imor', j.morada)) f.push('morada');
      if(j.agencia && cur!=='Minha angariação' && setIf('iag', j.agencia)) f.push('agência');
      var xs=document.querySelectorAll('[data-x]'), i, nx=0;
      for(i=0;i<xs.length;i++){ if((j.extras||[]).indexOf(xs[i].getAttribute('data-x'))>-1 && xs[i].className.indexOf(' on')<0){ xs[i].className='chip on'; nx++; } }
      if(nx) f.push(nx+' característica(s)');
      var no=document.getElementById('inot');
      if(no && j.resumo && no.value.indexOf(j.resumo)<0){
        var add=j.resumo+(j.agencia && cur==='Minha angariação'?'\nAnunciado por: '+j.agencia:'');
        no.value=no.value?no.value+'\n\n'+add:add; imvInit.inot=no.value; f.push('descrição');
      }
      if(blk) blk.style.display='none';
      toast(f.length?'Preenchido: '+f.slice(0,5).join(', ')+(f.length>5?'…':''):'Nada novo para preencher');
    });
  });
}

var numMes=0;
var MESES_L=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function mesKey(off){ var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+off); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function contaMes(k){
  var r={novos:0, inter:0, reun:0, apres:0, ang:0, excl:0, vend:0, com:0, orig:{}}, i, j, c, x;
  for(i=0;i<db.contacts.length;i++){ c=db.contacts[i];
    if(String(c.criado||'').indexOf(k)===0){ r.novos++; r.orig[c.origem||'Outro']=(r.orig[c.origem||'Outro']||0)+1; }
    for(j=0;j<(c.hist||[]).length;j++){ x=c.hist[j]; if(String(x.d).indexOf(k)===0 && x.canal!=='Nota') r.inter++; }
    for(j=0;j<(c.ag||[]).length;j++){ x=c.ag[j]; if(x.feito && String(x.d).indexOf(k)===0 && (x.tipo==='Visita'||x.tipo==='Reunião de angariação'||x.tipo==='Avaliação do imóvel')) r.reun++; }
    for(j=0;j<(c.vis||[]).length;j++){ if(String(c.vis[j].d).indexOf(k)===0) r.apres++; }
    if(c.ang){ if(String(c.ang.ini||'').indexOf(k)===0){ r.ang++; if(c.ang.excl) r.excl++; }
      if(c.ang.estado==='Vendido' && String(c.ang.vendidoEm||'').indexOf(k)===0){ r.vend++; r.com+=comMinha(c.ang); } }

var mkt={neg:'venda', tip:'Todas', rows:null, desc:null, loading:false}, mktCache={};
function tipBucket(q){ if(q===''||q==null||isNaN(Number(q))) return null; q=Number(q); return q<=1?'T0-T1':(q>=4?'T4+':'T'+q); }
function tipFromStr(t){ var m=String(t||'').match(/T\s?(\d)/i); return m?tipBucket(m[1]):null; }
function negKey(n){ return /arrend/i.test(n||'')?'arrendamento':'venda'; }
function eurm2(n){ return Math.round(Number(n)||0).toLocaleString('pt-PT')+' €/m²'; }
function loadMercado(){
  if(!sess||mkt.loading) return; mkt.loading=true; var neg=mkt.neg, n=2;
  function fim(){ if(--n===0){ mkt.loading=false; if(cur==='mercado') render(); } }
  rest('POST','/rest/v1/rpc/mercado_resumo',JSON.stringify({p_neg:neg}),null,function(st,j){ mkt.rows=(st===200&&j)?j:[]; fim(); });
  rest('POST','/rest/v1/rpc/mercado_descidas',JSON.stringify({p_neg:neg}),null,function(st,j){ mkt.desc=(st===200&&j)?j:[]; fim(); });
}

function mktKey(zona, tip, neg){ return (zona||'')+'|'+(tip||'')+'|'+neg; }
function getMkt(zona, tip, neg, cb){
  if(!zona||zona==='Outra'||!sess){ cb(null); return; }
  var k=mktKey(zona,tip,neg), c=mktCache[k];
  if(c && c.data!==undefined){ cb(c.data); return; }
  if(c && c.wait){ c.wait.push(cb); return; }
  mktCache[k]={wait:[cb]};
  rest('POST','/rest/v1/rpc/mercado_zona',JSON.stringify({p_zona:zona,p_tip:tip,p_neg:neg}),null,function(st,j){
    var w=mktCache[k].wait; mktCache[k]={data:(st===200&&j)?j:null};
    for(var i=0;i<w.length;i++) w[i](mktCache[k].data);
  });
}
function mktFor(m){ return {zona:m.zona, tip:tipBucket(m.quartos), neg:negKey(m.negocio)}; }
function imvEur(m){ return m.preco&&m.area&&Number(m.area)>0 ? Number(m.preco)/Number(m.area) : null; }
function difTxt(v, med){ var d=Math.round(100*(v-med)/med); return d===0?'em linha com a mediana':(Math.abs(d)+'% '+(d>0?'acima':'abaixo')+' da mediana'); }

}
function mktBox(m){

/* ================= ESTUDOS DO ANALISTA ================= */
function semAcento(t){ return String(t).normalize?String(t).normalize('NFD').replace(/[̀-ͯ]/g,''):String(t); }
function numPT(t){
  var ms=String(t||'').replace(/\s/g,'').match(/\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:,\d+)?/g); if(!ms) return null;

function parseEstudo(txt){

      var m=l.replace(/[*`]/g,'').match(/^\s*([A-Za-zÀ-ÿ0-9_\/ ]{3,30}):\s*(.*)$/); if(!m) return;
      var k=semAcento(m[1]).toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,''), v=m[2].replace(/^\(|\)$/g,'').trim();
      if(v && !/^\(?s[oó] no modo/i.test(v)) dados[k]=v;
    });
  }

  var secs=[], cur2=null;

    var isH=/^\s*#{1,4}\s+\S/.test(raw) || (/^\s*\*\*[^*]{3,80}\*\*\s*:?\s*$/.test(raw)) ||
            (/^(\d{1,2}[\.\)]\s*)?[A-ZÁÉÍÓÚÂÊÔÃÕÇ][A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9 \/\-–,()]{3,70}$/.test(clean) && clean===clean.toUpperCase());
    if(isH && clean.length<=90){ cur2={t:clean.replace(/^\d{1,2}[\.\)]\s*/,''), b:[]}; secs.push(cur2); }
    else { if(!cur2){ cur2={t:'Resumo', b:[]}; secs.push(cur2); } cur2.b.push(raw); }
  });
  secs=secs.map(function(x){ return {t:x.t, b:x.b.join('\n').trim()}; }).filter(function(x){ return x.b; });
  var g=function(){ for(var a=0;a<arguments.length;a++){ if(dados[arguments[a]]) return dados[arguments[a]]; } return ''; };
  return { id:uid(), d:nowLocal(), modo:g('MODO'), zona:g('ZONA_MORADA','ZONA','MORADA'), tipologia:g('TIPOLOGIA'), area:numPT(g('AREA_M2','AREA')),
    pedido:numPT(g('PRECO_PEDIDO')), valor:numPT(g('VALOR_MERCADO_EST','VALOR_MERCADO')), valorTxt:g('VALOR_MERCADO_EST','VALOR_MERCADO'), eurm2:numPT(g('EUR_M2')),
    score:numPT(g('SCORE')), classe:g('CLASSE'), recomendacao:g('RECOMENDACAO'), confianca:g('CONFIANCA'), data:g('DATA'),
    temDados:i>-1, secs:secs.slice(0,30), texto:t.slice(0,40000) };
}

function mdLite(t){

    h+='<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:12.5px;margin:6px 0;min-width:100%">'+rows.map(function(r,ri){ var cs=r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|');

  var c=byId(cid); if(!c) return; var q="'"+cid+"'", w=telNorm(c.tel);
  var h='<div class="sheet-h"><h2>WhatsApp</h2><button class="x" onclick="openContact('+q+')">×</button></div>';
  h+='<div class="note" style="margin-bottom:10px">'+esc(c.nome)+(c.tel?' · '+esc(c.tel):' · sem telemóvel')+'</div>';
  h+='<button class="btn gold full" onclick="openWaChat('+q+')">🤖 Analisar conversa com IA<br><span style="font-weight:400;font-size:12.5px">carregar exportação ou colar texto</span></button>';
  h+='<button class="btn full" style="margin-top:8px" onclick="openMsgs('+q+')">✍️ Mensagens prontas</button>';
  h+='<button class="btn ghost full" style="margin-top:8px" onclick="'+(w?'window.open(\'https://wa.me/'+w+'\',\'_blank\')':'toast(\'Sem telemóvel\')')+'">Abrir conversa no WhatsApp</button>';
  openModal(h);
}
function pasteChat(cid){
  var t=v('wtxt'); if(t.length<30){ toast('Cole a conversa primeiro'); return; }
  var b; try{ b=new Blob([t],{type:'text/plain'}); }catch(e){ toast('Não foi possível ler o texto'); return; }
  sendChat(b,'conversa.txt',cid);
}
function pickChat(inp, cid){
  var f=inp.files[0]; if(!f) return;
  if(f.size>40*1024*1024){ toast('Ficheiro grande demais — exporte “Sem multimédia”'); return; }
  sendChat(f, f.name||'conversa.zip', cid);
}
function sendChat(f, fname, cid){
  openModal('<div class="spin">💬 A ler a conversa…<div class="note" style="margin-top:8px;font-weight:400">Pode demorar até meio minuto.</div></div>');
  var fd=new FormData(), list=[], i;
  fd.append('file', f, fname);
  for(i=0;i<db.contacts.length;i++) list.push({id:db.contacts[i].id, nome:db.contacts[i].nome, tel:db.contacts[i].tel||''});
  fd.append('contacts', JSON.stringify(list));
  fd.append('now', nowLocal());
  fd.append('weekday', DIAS_L[new Date().getDay()]);
  if(cid) fd.append('contact_id', cid);
  withToken(function(t){
    if(!t){ openWaChat(cid); toast('Sem ligação / sessão'); return; }
    xhr('POST', SB_URL+'/functions/v1/whatsapp-chat', {apikey:SB_KEY, Authorization:'Bearer '+t}, fd, function(st,j){
      if(st===200 && j && !j.error){ j.kind='wa'; reviewAudio(j, cid); return; }
      var e=j&&j.error, m='Não foi possível analisar a conversa';
      if(e==='sem_chave') m='A IA ainda não está ativada (falta a chave)';
      else if(e==='grande') m='Ficheiro grande demais — exporte “Sem multimédia”';
      else if(e==='zip'||e==='sem_txt') m='Não encontrei a conversa dentro do ficheiro';
      else if(e==='vazio') m='O ficheiro parece vazio';
      else if(e==='sem_acesso') m='Esta conta não tem acesso';
      else if(e==='analise') m='A IA está ocupada — tente daqui a 1 minuto';
      else if(st===0) m='Sem ligação à internet';
      openWaChat(cid); toast(m);
    });
  });
}

/* ================= NOTA DE ÁUDIO (IA) ================= */
var audRes=null, rec=null, recChunks=[];
var DIAS_L=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function qid(cid){ return cid ? "'"+cid+"'" : 'null'; }
function openAudio(cid){
  var c=cid?byId(cid):null;
  var h='<div class="sheet-h"><h2>Nota de áudio</h2><button class="x" onclick="'+(cid?'openContact('+qid(cid)+')':'closeModal()')+'">×</button></div>';
  if(!sess){
    openModal(h+'<div class="card">Para a IA transcrever e resumir os áudios, entre primeiro na sua conta.</div><button class="btn gold full" onclick="closeModal();go(\'mais\')">Entrar na conta</button>');
    return;
  }
  h+='<div class="note" style="margin-bottom:12px">'+(c?'Contacto: <b>'+esc(c.nome)+'</b>. ':'')+'A IA transcreve, separa o que é importante, guarda como nota e propõe os compromissos para a agenda. Revê tudo antes de guardar.</div>';
  h+='<input type="file" id="afile" accept="audio/*,video/mp4,.m4a,.mp3,.ogg,.opus,.wav,.webm" style="display:none" onchange="pickAudio(this,'+qid(cid)+')">';
  h+='<button class="btn gold full" onclick="document.getElementById(\'afile\').click()">📂 Carregar áudio</button>';
  if(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    h+='<button class="btn full" id="recbtn" style="margin-top:8px" onclick="recToggle('+qid(cid)+')">🎙️ Gravar agora</button>';
  h+='<label>Ou escreva / dite o texto</label><textarea id="atext" placeholder="Ex.: Falei com a proprietária, quer 285 mil pelo T2, reunião sexta às 18h…"></textarea>';
  h+='<button class="btn ghost full" style="margin-top:8px" onclick="sendText('+qid(cid)+')">Analisar texto</button>';
  h+='<button class="btn ghost full" style="margin-top:14px" onclick="openWaChat('+qid(cid)+')">💬 Analisar uma conversa inteira do WhatsApp</button>';
  h+='<div class="note" style="margin-top:12px">Áudio do WhatsApp: toque no áudio → Partilhar → Guardar em Ficheiros, e carregue-o aqui. Máx. 25 MB.</div>';
  openModal(h);
}
function pickAudio(inp, cid){
  var f=inp.files[0]; if(!f) return;
  if(f.size>25*1024*1024){ toast('Áudio demasiado grande (máx. 25 MB)'); return; }
  sendAudio(f, f.name||'audio.m4a', '', cid);
}
function sendText(cid){
  var t=v('atext'); if(!t){ toast('Escreva ou dite o texto'); return; }
  sendAudio(null, '', t, cid);
}
function recToggle(cid){
  var b=document.getElementById('recbtn');
  if(rec && rec.state==='recording'){ rec.stop(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recChunks=[]; rec=new MediaRecorder(stream);
    rec.ondataavailable=function(e){ if(e.data && e.data.size) recChunks.push(e.data); };
    rec.onstop=function(){
      var tr=stream.getTracks(); for(var i=0;i<tr.length;i++) tr[i].stop();
      var type=(rec.mimeType||'audio/mp4').split(';')[0];
      var ext=type.indexOf('webm')>-1?'webm':(type.indexOf('ogg')>-1?'ogg':'m4a');
      var blob=new Blob(recChunks,{type:type}); rec=null;
      if(!blob.size){ toast('Gravação vazia'); return; }
      sendAudio(blob,'gravacao.'+ext,'',cid);
    };
    rec.start();
    if(b){ b.className='btn full rec'; b.innerHTML='⏹️ Parar e analisar'; }
  })['catch'](function(){ toast('Sem acesso ao microfone'); });
}
function sendAudio(blob, name, text, cid){
  openModal('<div class="spin">🎧 A transcrever e a analisar…<div class="note" style="margin-top:8px;font-weight:400">Pode demorar alguns segundos.</div></div>');
  var fd=new FormData(), list=[], i;
  if(blob) fd.append('file', blob, name);
  if(text) fd.append('text', text);
  for(i=0;i<db.contacts.length;i++) list.push({id:db.contacts[i].id, nome:db.contacts[i].nome});
  fd.append('contacts', JSON.stringify(list));
  fd.append('now', nowLocal());
  fd.append('weekday', DIAS_L[new Date().getDay()]);
  if(cid) fd.append('contact_id', cid);
  withToken(function(t){
    if(!t){ openAudio(cid); toast('Sem ligação / sessão'); return; }
    xhr('POST', SB_URL+'/functions/v1/audio-nota', {apikey:SB_KEY, Authorization:'Bearer '+t}, fd, function(st,j){
      if(st===200 && j && !j.error){ reviewAudio(j, cid); return; }
      var e=j&&j.error, m='Não foi possível analisar o áudio';
      if(e==='sem_chave') m='A IA ainda não está ativada (falta a chave)';
      else if(e==='grande') m='Áudio demasiado grande (máx. 25 MB)';
      else if(e==='sem_acesso') m='Esta conta não tem acesso';
      else if(e==='vazio') m='Não se percebeu nada no áudio';
      else if(e==='transcricao') m='Formato de áudio não suportado';
      else if(st===0) m='Sem ligação à internet';
      openAudio(cid); toast(m);
    });
  });
}
function reviewAudio(r, cid){
  audRes=r; var wa=r.kind==='wa', i, h='<div class="sheet-h"><h2>'+(wa?'Rever conversa':'Rever nota')+'</h2><button class="x" onclick="closeModal()">×</button></div>';
  if(wa && r.cortado) h+='<div class="note" style="margin-bottom:6px">Conversa longa ('+esc(r.linhas)+' linhas): a IA leu a parte mais recente.</div>';
  var sel=cid||r.contacto_id||(r.contacto_novo?'__new':'');
  var cs=db.contacts.slice().sort(function(a,b){ return a.nome.localeCompare(b.nome); });
  h+='<label>Contacto</label><select id="acont" onchange="document.getElementById(\'anew\').style.display=this.value===\'__new\'?\'block\':\'none\'">'+
     '<option value="">— escolher —</option>';
  for(i=0;i<cs.length;i++) h+='<option value="'+esc(cs[i].id)+'"'+(cs[i].id===sel?' selected':'')+'>'+esc(cs[i].nome)+'</option>';
  h+='<option value="__new"'+(sel==='__new'?' selected':'')+'>➕ Novo contacto</option></select>';
  var nn=r.contacto_novo||{nome:'',tel:''};
  h+='<div id="anew" style="display:'+(sel==='__new'?'block':'none')+'"><div class="g2"><div><label>Nome</label><input id="anome" value="'+esc(nn.nome)+'"></div><div><label>Telemóvel</label><input id="atel" type="tel" value="'+esc(nn.tel)+'"></div></div></div>';
  var txt=r.resumo||''; for(i=0;i<(r.pontos||[]).length;i++) txt+=(txt?'\n':'')+'• '+r.pontos[i];
  if(!txt) txt=r.transcricao||'';
  h+='<label>Nota (o mais importante)</label><textarea id="anotaTxt" style="min-height:150px">'+esc(txt)+'</textarea>';
  h+='<h3>'+(wa?'Próximos passos para a agenda':'Compromissos para a agenda')+'</h3>';
  var cp=r.compromissos||[], nSug=0;
  if(!cp.length) h+='<div class="note">Não foi detetado nenhum compromisso com data'+(wa?' na conversa.':' no áudio.')+'</div>';
  for(i=0;i<cp.length;i++){
    var sug=cp[i].origem==='sugerido', marc=!sug || (nSug++===0);
    h+='<div class="cmp"><div class="hd"><input type="checkbox" id="ck_'+i+'"'+(marc?' checked':'')+'> <span>Adicionar à agenda</span>'+
       (cp[i].origem?'<span class="tag '+(sug?'blue':'gold')+'" style="margin:0 0 0 auto">'+(sug?'Sugerido pela IA':'Combinado')+'</span>':'')+'</div>'+
       '<select id="ct_'+i+'" style="margin-top:8px">'+opts(ACOES,cp[i].tipo)+'</select>'+
       '<div class="g2" style="margin-top:8px"><div><input type="date" id="cd_'+i+'" value="'+esc(cp[i].data)+'"></div><div><input type="time" id="ch_'+i+'" value="'+esc(cp[i].hora)+'"></div></div>'+
       '<input id="cn_'+i+'" style="margin-top:8px" value="'+esc(cp[i].nota)+'" placeholder="Nota"></div>';
  }
  if(r.estado_sugerido) h+='<div class="cmp"><div class="hd"><input type="checkbox" id="cest" checked> <span>Mudar estado para “'+esc(r.estado_sugerido)+'”</span></div></div>';
  var cAtual=sel&&sel!=='__new'?byId(sel):null;
  if(r.interesse && (!cAtual || cAtual.interesse!==r.interesse)) h+='<div class="cmp"><div class="hd"><input type="checkbox" id="cint"'+(cAtual&&cAtual.interesse?'':' checked')+'> <span>Imóvel / interesse: “'+esc(r.interesse)+'”</span></div></div>';
  if(r.valor && (!cAtual || String(cAtual.orcamento)!==String(r.valor))) h+='<div class="cmp"><div class="hd"><input type="checkbox" id="cval"'+(cAtual&&cAtual.orcamento?'':' checked')+'> <span>Valor: '+eur(r.valor)+'</span></div></div>';
  if(r.tel && cAtual && !cAtual.tel) h+='<div class="cmp"><div class="hd"><input type="checkbox" id="ctel" checked> <span>Guardar telemóvel '+esc(r.tel)+'</span></div></div>';
  if(r.transcricao) h+='<details><summary>'+(wa?'Ver conversa analisada':'Ver transcrição completa')+'</summary><div style="white-space:pre-wrap;margin-top:8px">'+esc(r.transcricao)+'</div></details>';
  h+='<button class="btn gold full" style="margin-top:16px" onclick="saveAudio()">'+(wa?'Guardar resumo e agendamentos':'Guardar nota e agendamentos')+'</button>';
  openModal(h);
}
function saveAudio(){
  var r=audRes, sel=v('acont'), c, i, added=[];
  if(!sel){ toast('Escolha o contacto'); return; }
  if(sel==='__new'){
    var nome=v('anome'); if(!nome){ toast('Escreva o nome do contacto'); return; }
    c={id:uid(), criado:nowLocal(), hist:[{d:nowLocal(),canal:'Nota',txt:'Contacto criado a partir de '+(r.kind==='wa'?'conversa de WhatsApp':'nota de áudio')}], ag:[],
       nome:nome, tel:v('atel'), email:'', tipo:'Proprietário (venda)', origem:'Outro', zona:'Outra', estado:'Novo', interesse:'', orcamento:'', notas:''};
    db.contacts.push(c);
  } else c=byId(sel);
  if(!c) return;
  c.hist=c.hist||[]; c.ag=c.ag||[];
  var txt=v('anotaTxt'); if(txt) c.hist.push({d:nowLocal(), canal:r.kind==='wa'?'Conversa WhatsApp':'Áudio', txt:txt});
  var ci=document.getElementById('cint'); if(ci && ci.checked) c.interesse=r.interesse;
  var cv=document.getElementById('cval'); if(cv && cv.checked) c.orcamento=String(r.valor);
  var ctl=document.getElementById('ctel'); if(ctl && ctl.checked && !c.tel) c.tel=r.tel;
  for(i=0;i<(r.compromissos||[]).length;i++){
    if(!document.getElementById('ck_'+i).checked) continue;
    var d=v('cd_'+i), hh=v('ch_'+i); if(!d||!hh) continue;
    var a={id:uid(), d:d+'T'+hh, tipo:v('ct_'+i), nota:v('cn_'+i), feito:false};
    c.ag.push(a); added.push(a);
  }
  var ce=document.getElementById('cest'); if(ce && ce.checked) c.estado=r.estado_sugerido;
  save(c); render();
  if(!isClosed(c) && !nextAp(c)){ newAp(c.id,true); toast('Nota guardada — marque o próximo passo'); }
  else if(added.length===1){ askCal(c.id, added[0].id); toast('Nota e agendamento guardados'); }
  else { openContact(c.id); toast(added.length?('Nota + '+added.length+' agendamentos guardados'):'Nota guardada'); }
}

render();
setCloud(sess?'ok':'');
if(sess) sync(false);
document.addEventListener('visibilitychange', function(){ if(!document.hidden && sess) sync(false); });
</script>
