<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JS Imóveis">
<meta name="theme-color" content="#232428">
<title>CRM Imobiliário · Josimar Souza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ====== CORES DA MARCA — altere aqui ====== */
:root{
  --navy:#232428;   /* carvão da marca */
  --navy2:#2C2D32;
  --navy3:#3A3B41;
  --gold:#D70B35;   /* vermelho da marca */
  --gold2:#FF6B84;  /* vermelho claro, para texto pequeno sobre fundo escuro */
  --cream:#F3F3F4;
  --ink:#1E1F23;
  --muted:#6B6E76;
  --line:#E3E3E6;
  --bg:#F5F5F6;
  --red:#D70B35;
  --green:#2F8A5B;
  --blue:#2D6CB5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:16px}
header{background:var(--navy);color:var(--cream);padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;letter-spacing:-.02em}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:#fff}
.brand small{display:block;color:#C9CACD;font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
.hdr-btn{margin-left:auto;background:transparent;border:1px solid var(--navy3);color:var(--cream);border-radius:10px;padding:8px 10px;font-size:13px}
main{padding:16px 16px calc(env(safe-area-inset-bottom) + 90px);max-width:820px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:30;border-top:1px solid var(--navy3)}
nav button{flex:1;background:none;border:0;color:#9AA4B8;font-size:11px;font-weight:600;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.03em}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:#fff;box-shadow:inset 0 3px 0 var(--gold)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 78px);width:56px;height:56px;border-radius:50%;background:var(--gold);color:#fff;border:0;font-size:30px;font-weight:500;box-shadow:0 6px 18px rgba(14,26,44,.35);z-index:31}
h2{font-weight:800;letter-spacing:-.02em;font-size:23px;margin:4px 0 12px;color:var(--navy)}
h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.stats{display:flex;gap:10px;margin-bottom:6px}
.stat{flex:1;background:var(--navy);color:var(--cream);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;color:#fff;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#B9C1D0}
.stat.alert b{color:var(--gold2)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:var(--cream);color:var(--navy);margin-right:4px;margin-top:6px}
.tag.gold{background:var(--gold);color:#fff}
.tag.red{background:#FCE1E6;color:var(--red)}
.tag.green{background:#DFF1E7;color:var(--green)}
.tag.blue{background:#E1ECF8;color:var(--blue)}
.when{font-size:12.5px;font-weight:600;color:var(--navy);text-align:right;white-space:nowrap}
.when.late{color:var(--red)}
.when.today{color:var(--navy);text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.chip.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;background:var(--navy);color:var(--cream)}
.btn.gold{background:var(--gold);color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.red{background:#fff;color:var(--red);border:1px solid #F3B9C4}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,32,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:820px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);-webkit-overflow-scrolling:touch}
.sheet-h{display:flex;align-items:center;margin-bottom:10px}
.sheet-h h2{margin:0;flex:1}
.x{background:none;border:0;font-size:26px;color:var(--muted);padding:0 4px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px;letter-spacing:.04em;text-transform:uppercase}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
textarea{min-height:76px;resize:vertical}
.g2{display:flex;gap:10px}.g2>div{flex:1;min-width:0}
.box{background:var(--navy);color:var(--cream);border-radius:14px;padding:12px 14px;margin-top:16px}
.box label{color:#C9CACD}
.box input,.box select,.box textarea{border-color:var(--navy3)}
.req{color:var(--gold2);font-size:12px;margin-top:4px}
.qa{display:flex;gap:8px;margin:12px 0}
.qa a,.qa button{flex:1;text-align:center;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;color:var(--navy);font-weight:600;font-size:13px}
.qa .ic{display:block;font-size:20px;margin-bottom:2px}
.hist{border-left:2px solid var(--gold);padding:2px 0 2px 12px;margin:8px 0}
.hist b{font-size:12px;color:var(--muted);font-weight:600}
.ap{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.ap.done{opacity:.55}
.ap .t{font-weight:700;color:var(--navy)}
.cal-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.fab2{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom) + 146px);width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;border:1.5px solid var(--gold);font-size:22px;box-shadow:0 6px 18px rgba(14,26,44,.3);z-index:31}
#cloud{font-size:15px;margin-left:auto;cursor:pointer}
#cloud+.hdr-btn{margin-left:8px}
.spin{text-align:center;padding:34px 10px;color:var(--navy);font-weight:600}
.rec{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
details summary{font-weight:600;color:var(--navy)}
.cmp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cmp .hd{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--navy)}
.cmp input[type=checkbox]{width:20px;height:20px;-webkit-appearance:checkbox;appearance:auto;padding:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 150px);transform:translateX(-50%);background:var(--navy);color:#fff;border-left:4px solid var(--gold);padding:10px 16px;border-radius:20px;font-weight:600;font-size:14px;z-index:80;display:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.pipe-col{margin-bottom:14px}
.pipe-h{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:var(--cream);border-radius:12px;padding:9px 12px;font-weight:600;font-size:14px}
.pipe-h span{background:var(--gold);color:#fff;border-radius:20px;padding:1px 9px;font-size:12px}
.pipe-col .card{margin:6px 0 0}
.day-h{font-weight:700;color:var(--navy);margin:16px 0 6px;font-size:14px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">JS</div>
    <div>
      <h1>Josimar Souza</h1>
      <small>Consultor Imobiliário · Imotrust</small>
    </div>
    <span id="cloud" onclick="go('mais')"></span>
    <button class="hdr-btn" onclick="openCalendarMenu()">📅 Agenda</button>
  </div>
</header>

<main id="view"></main>

<button class="fab2" onclick="openAudio()" aria-label="Nota de áudio">🎙️</button>
<button class="fab" onclick="openForm()">+</button>

<nav>
  <button data-v="hoje" class="on" onclick="go('hoje')"><span class="ic">☀️</span>Hoje</button>
  <button data-v="contactos" onclick="go('contactos')"><span class="ic">👥</span>Contactos</button>
  <button data-v="pipeline" onclick="go('pipeline')"><span class="ic">📊</span>Pipeline</button>
  <button data-v="agenda" onclick="go('agenda')"><span class="ic">🗓️</span>Agenda</button>
  <button data-v="mais" onclick="go('mais')"><span class="ic">⚙️</span>Mais</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ES5 apenas — compatível com Safari iOS antigo */
var KEY = 'crm_imob_v1';
var TIPOS = ['Comprador','Proprietário (venda)','Senhorio (arrendar)','Arrendatário','Investidor','Parceiro'];
var ORIGENS = ['OLX','Idealista','Indicação','Cartas / porta-a-porta','Instagram','Placa / Montra','Imotrust','Outro'];
var ESTADOS = ['Novo','Contactado','Qualificado','Reunião / Visita marcada','Avaliação / Proposta','Angariado / Fechado','Nutrir','Perdido'];
var FECHADOS = ['Angariado / Fechado','Perdido'];
var ACOES = ['Ligar','WhatsApp','Visita','Reunião de angariação','Avaliação do imóvel','Enviar imóveis','Follow-up','Assinatura CMI / CPCV','Escritura'];
var ZONAS = ['Alfragide','Amadora','Oeiras','Queluz','Prior Velho','Cascais','Lisboa','Outra'];

var db = load();
var cur = 'hoje';
var filtro = {q:'', tipo:'Todos', estado:'Todos'};

function load(){
  try{ var s = localStorage.getItem(KEY); if(s){ return JSON.parse(s); } }catch(e){}
  return seed();
}
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast('Erro ao guardar!'); }
}
function save(c){ // c = contacto alterado (marca-o para sincronizar)
  if(c) c.upd=Date.now();
  saveLocal(); scheduleSync();
}
function uid(){ return 'c' + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function pad(n){ return (n<10?'0':'') + n; }
function nowLocal(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
function addDays(n, h){ var d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+(h||'10:00'); }
function parseL(s){ // 'YYYY-MM-DDTHH:MM' -> Date local (Safari não aceita bem new Date(s))
  if(!s) return null; var p=s.split('T'); var d=p[0].split('-'); var t=(p[1]||'00:00').split(':');
  return new Date(+d[0], +d[1]-1, +d[2], +t[0], +t[1]);
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(n){ var p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?').charAt(0) + (p.length>1?p[p.length-1].charAt(0):'')).toUpperCase(); }
var DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmt(s){
  var d=parseL(s); if(!d) return '—';
  var hoje=new Date(); hoje.setHours(0,0,0,0);
  var dd=new Date(d.getTime()); dd.setHours(0,0,0,0);
  var diff=Math.round((dd-hoje)/86400000);
  var h=pad(d.getHours())+':'+pad(d.getMinutes());
  if(diff===0) return 'Hoje '+h;
  if(diff===1) return 'Amanhã '+h;
  if(diff===-1) return 'Ontem '+h;
  return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]+' · '+h;
}
function dayLabel(d){ return DIAS[d.getDay()]+', '+d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear(); }
function whenClass(s){
  var d=parseL(s); if(!d) return ''; var n=new Date();
  if(d<n) return 'late';
  if(d.toDateString()===n.toDateString()) return 'today';
  return '';
}
function isClosed(c){ return FECHADOS.indexOf(c.estado)>-1; }
function nextAp(c){
  var best=null;
  for(var i=0;i<(c.ag||[]).length;i++){ var a=c.ag[i]; if(!a.feito && (!best || a.d<best.d)) best=a; }
  return best;
}
function semAg(c){ return !isClosed(c) && !nextAp(c); }
function byId(id){ for(var i=0;i<db.contacts.length;i++){ if(db.contacts[i].id===id) return db.contacts[i]; } return null; }
function toast(t){ var e=document.getElementById('toast'); e.innerHTML=esc(t); e.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){e.style.display='none';},2200); }
function tagTipo(t){
  var cls = t==='Comprador'||t==='Arrendatário'||t==='Investidor' ? 'blue' : (t==='Parceiro'?'':'gold');
  return '<span class="tag '+cls+'">'+esc(t)+'</span>';
}
function tagEstado(e){
  var cls = e==='Angariado / Fechado' ? 'green' : (e==='Perdido' ? 'red' : '');
  return '<span class="tag '+cls+'">'+esc(e)+'</span>';
}

function seed(){ return {contacts:[]}; }

/* ---------- Navegação ---------- */
function go(v){
  cur=v;
  var bs=document.querySelectorAll('nav button');
  for(var i=0;i<bs.length;i++){ bs[i].className = bs[i].getAttribute('data-v')===v ? 'on' : ''; }
  render(); window.scrollTo(0,0);
}
function render(){
  var h='';
  if(cur==='hoje') h=vHoje();
  else if(cur==='contactos') h=vContactos();
  else if(cur==='pipeline') h=vPipeline();
  else if(cur==='agenda') h=vAgenda();
  else if(cur==='olx') h=vOlx();
  else if(cur==='ang') h=vAng();
  else h=vMais();
  document.getElementById('view').innerHTML=h;
}

function contactCard(c, showWhen){
  var a=nextAp(c);
  var right='';
  if(showWhen!==false){
    if(a) right='<div class="when '+whenClass(a.d)+'">'+esc(fmt(a.d))+'<div class="sub" style="text-align:right">'+esc(a.tipo)+'</div></div>';
    else if(!isClosed(c)) right='<div class="when late">Sem agendamento</div>';
  }
  return '<div class="card tap" onclick="openContact(\''+c.id+'\')"><div class="row">'+
    '<div class="av">'+esc(initials(c.nome))+'</div>'+
    '<div class="grow"><div class="name">'+esc(c.nome)+'</div><div class="sub">'+esc(c.interesse||c.zona||'')+'</div></div>'+
    right+'</div>'+
    '<div>'+tagTipo(c.tipo)+tagEstado(c.estado)+(c.zona&&c.zona!=='Outra'?'<span class="tag">'+esc(c.zona)+'</span>':'')+'</div></div>';
}

/* ---------- HOJE ---------- */
function vHoje(){
  var now=new Date(); var fimHoje=new Date(); fimHoje.setHours(23,59,59,999);
  var atrasados=[], hoje=[], semana=[], sem=[];
  var fim7=new Date(); fim7.setDate(fim7.getDate()+7);
  var ativos=0;
  for(var i=0;i<db.contacts.length;i++){
    var c=db.contacts[i]; if(!isClosed(c)) ativos++;
    if(semAg(c)){ sem.push(c); continue; }
    var a=nextAp(c); if(!a) continue; var d=parseL(a.d);
    if(d<now && d.toDateString()!==now.toDateString()) atrasados.push(c);
    else if(d<=fimHoje) hoje.push(c);
    else if(d<=fim7) semana.push(c);
  }
  function srt(arr){ arr.sort(function(x,y){ return nextAp(x).d<nextAp(y).d?-1:1; }); return arr; }
  srt(atrasados); srt(hoje); srt(semana);
  var hr=new Date().getHours();
  var h='<h2>'+(hr<12?'Bom dia':(hr<20?'Boa tarde':'Boa noite'))+', Josimar</h2>';
  h+='<div class="stats"><div class="stat"><b>'+hoje.length+'</b><span>Hoje</span></div>'+
     '<div class="stat '+(atrasados.length?'alert':'')+'"><b>'+atrasados.length+'</b><span>Atrasados</span></div>'+
     '<div class="stat"><b>'+ativos+'</b><span>Ativos</span></div></div>';
  var ct=contratosAlerta();
  if(ct.length){ h+='<h3 style="color:var(--red)">📄 Contratos a terminar ('+ct.length+')</h3>'; for(i=0;i<ct.length;i++) h+=angCard(ct[i]); }
  if(sem.length){ h+='<h3 style="color:var(--red)">⚠️ Sem agendamento ('+sem.length+')</h3>'; for(i=0;i<sem.length;i++) h+=contactCard(sem[i]); }
  if(atrasados.length){ h+='<h3 style="color:var(--red)">Atrasados</h3>'; for(i=0;i<atrasados.length;i++) h+=contactCard(atrasados[i]); }
  h+='<h3>Hoje</h3>';
  if(hoje.length){ for(i=0;i<hoje.length;i++) h+=contactCard(hoje[i]); } else h+='<div class="empty">Nada marcado para hoje.</div>';
  if(semana.length){ h+='<h3>Próximos 7 dias</h3>'; for(i=0;i<semana.length;i++) h+=contactCard(semana[i]); }
  return h;
}

/* ---------- CONTACTOS ---------- */
function vContactos(){
  var h='<h2>Contactos</h2>';
  h+='<input class="search" placeholder="Pesquisar nome, telefone, zona, notas…" value="'+esc(filtro.q)+'" oninput="filtro.q=this.value;listaContactos()">';
  h+='<div class="chips">'; var ts=['Todos'].concat(TIPOS);
  for(var i=0;i<ts.length;i++) h+='<button class="chip '+(filtro.tipo===ts[i]?'on':'')+'" onclick="filtro.tipo=\''+ts[i]+'\';render()">'+esc(ts[i])+'</button>';
  h+='</div><div class="chips">'; var es=['Todos'].concat(ESTADOS);
  for(i=0;i<es.length;i++) h+='<button class="chip '+(filtro.estado===es[i]?'on':'')+'" onclick="filtro.estado=\''+es[i]+'\';render()">'+esc(es[i])+'</button>';
  h+='</div><div id="lista">'+htmlLista()+'</div>';
  return h;
}
function htmlLista(){
  var q=filtro.q.toLowerCase(); var out=[];
  for(var i=0;i<db.contacts.length;i++){
    var c=db.contacts[i];
    if(filtro.tipo!=='Todos' && c.tipo!==filtro.tipo) continue;
    if(filtro.estado!=='Todos' && c.estado!==filtro.estado) continue;
    if(q){ var s=(c.nome+' '+c.tel+' '+c.email+' '+c.zona+' '+c.interesse+' '+c.notas+' '+c.origem).toLowerCase(); if(s.indexOf(q)<0) continue; }
    out.push(c);
  }
  out.sort(function(a,b){ return a.nome.localeCompare(b.nome); });
  if(!out.length) return '<div class="empty">Nenhum contacto encontrado.</div>';
  var h='<div class="note" style="margin-bottom:8px">'+out.length+' contacto(s)</div>';
  for(i=0;i<out.length;i++) h+=contactCard(out[i]);
  return h;
}
function listaContactos(){ var e=document.getElementById('lista'); if(e) e.innerHTML=htmlLista(); }

/* ---------- PIPELINE ---------- */
function vPipeline(){
  var h='<h2>Pipeline</h2>'+angResumo()+'<div class="chips">'; var ts=['Todos'].concat(TIPOS);
  for(var i=0;i<ts.length;i++) h+='<button class="chip '+(filtro.tipo===ts[i]?'on':'')+'" onclick="filtro.tipo=\''+ts[i]+'\';render()">'+esc(ts[i])+'</button>';
  h+='</div>';
  for(var e=0;e<ESTADOS.length;e++){
    var arr=[];
    for(i=0;i<db.contacts.length;i++){ var c=db.contacts[i]; if(c.estado===ESTADOS[e] && (filtro.tipo==='Todos'||c.tipo===filtro.tipo)) arr.push(c); }
    h+='<div class="pipe-col"><div class="pipe-h">'+esc(ESTADOS[e])+'<span>'+arr.length+'</span></div>';
    for(i=0;i<arr.length;i++) h+=contactCard(arr[i]);
    h+='</div>';
  }
  return h;
}

/* ---------- AGENDA ---------- */
function vAgenda(){
  var all=[];
  for(var i=0;i<db.contacts.length;i++){ var c=db.contacts[i];
    for(var j=0;j<(c.ag||[]).length;j++){ if(!c.ag[j].feito) all.push({c:c,a:c.ag[j]}); } }
  all.sort(function(x,y){ return x.a.d<y.a.d?-1:1; });
  var h='<h2>Agenda</h2><div class="btns" style="margin-bottom:6px"><button class="btn ghost sm" onclick="openCal(\'google\')">Abrir Google Agenda</button><button class="btn ghost sm" onclick="openCal(\'ios\')">Abrir Calendário iPhone</button></div>';
  if(!all.length) return h+'<div class="empty">Sem agendamentos.</div>';
  var last='';
  for(i=0;i<all.length;i++){
    var d=parseL(all[i].a.d); var lab=dayLabel(d);
    if(lab!==last){ h+='<div class="day-h">'+esc(lab)+'</div>'; last=lab; }
    h+=apCard(all[i].c, all[i].a, true);
  }
  return h;
}
function apCard(c, a, showName){
  var d=parseL(a.d);
  return '<div class="ap '+(a.feito?'done':'')+'">'+
    '<div class="row"><div class="grow">'+
      '<div class="t">'+pad(d.getHours())+':'+pad(d.getMinutes())+' · '+esc(a.tipo)+'</div>'+
      (showName?'<div class="sub" onclick="openContact(\''+c.id+'\')" style="cursor:pointer;color:var(--navy);font-weight:600">'+esc(c.nome)+' ›</div>':'<div class="sub">'+esc(fmt(a.d))+'</div>')+
      (a.nota?'<div class="note">'+esc(a.nota)+'</div>':'')+
    '</div>'+(a.feito?'<span class="tag green">Feito</span>':'<span class="when '+whenClass(a.d)+'">'+(whenClass(a.d)==='late'?'Atrasado':'')+'</span>')+'</div>'+
    (a.feito?'':'<div class="cal-btns">'+
      '<button class="btn gold sm" onclick="doneAp(\''+c.id+'\',\''+a.id+'\')">✓ Feito</button>'+
      '<button class="btn ghost sm" onclick="gcal(\''+c.id+'\',\''+a.id+'\')">+ Google</button>'+
      '<button class="btn ghost sm" onclick="ics(\''+c.id+'\',\''+a.id+'\')">+ iPhone</button>'+
      '<button class="btn ghost sm" onclick="editAp(\''+c.id+'\',\''+a.id+'\')">Editar</button>'+
    '</div>')+
  '</div>';
}

/* ---------- MODAL ---------- */
function openModal(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('modal').className='modal open'; document.getElementById('sheet').scrollTop=0; }
function closeModal(){ document.getElementById('modal').className='modal'; }
document.getElementById('modal').onclick=function(e){ if(e.target.id==='modal') closeModal(); };
function opts(arr, sel){ var h=''; for(var i=0;i<arr.length;i++) h+='<option'+(arr[i]===sel?' selected':'')+'>'+esc(arr[i])+'</option>'; return h; }
function v(id){ var e=document.getElementById(id); return e?e.value.trim():''; }

/* ---------- FICHA DO CONTACTO ---------- */
function telNorm(t){
  var d=String(t||'').replace(/[^\d+]/g,'');
  if(!d) return '';
  if(d.charAt(0)==='+') return d.substring(1);
  if(d.indexOf('00')===0) return d.substring(2);
  if(d.length===9) return '351'+d;
  return d;
}
function openContact(id){
  var c=byId(id); if(!c) return;
  var w=telNorm(c.tel);
  var h='<div class="sheet-h"><h2>'+esc(c.nome)+'</h2><button class="x" onclick="closeModal()">×</button></div>';
  h+='<div>'+tagTipo(c.tipo)+tagEstado(c.estado)+(c.origem?'<span class="tag">'+esc(c.origem)+'</span>':'')+(c.zona?'<span class="tag">'+esc(c.zona)+'</span>':'')+'</div>';
  h+='<div class="qa">'+
     (c.tel?'<a href="tel:'+esc(c.tel.replace(/\s/g,''))+'"><span class="ic">📞</span>Ligar</a>':'<button onclick="toast(\'Sem telefone\')"><span class="ic">📞</span>Ligar</button>')+
     (w?'<a href="https://wa.me/'+w+'" target="_blank"><span class="ic">💬</span>WhatsApp</a>':'<button onclick="toast(\'Sem telefone\')"><span class="ic">💬</span>WhatsApp</button>')+
     (c.email?'<a href="mailto:'+esc(c.email)+'"><span class="ic">✉️</span>Email</a>':'<button onclick="toast(\'Sem email\')"><span class="ic">✉️</span>Email</button>')+
     '<button onclick="openForm(\''+c.id+'\')"><span class="ic">✏️</span>Editar</button></div>';
  h+='<button class="btn gold full" style="margin-bottom:12px" onclick="openMsgs(\''+c.id+'\')">💬 Mensagens prontas</button>';
  h+='<div class="card">'+
     (c.tel?'<div class="sub">📱 '+esc(c.tel)+'</div>':'')+
     (c.email?'<div class="sub">✉️ '+esc(c.email)+'</div>':'')+
     (c.interesse?'<div style="margin-top:6px"><b>Imóvel / interesse:</b> '+esc(c.interesse)+'</div>':'')+
     (c.orcamento?'<div><b>Valor:</b> '+esc(Number(c.orcamento).toLocaleString('pt-PT'))+' €</div>':'')+
     (c.notas?'<div class="note" style="margin-top:6px;white-space:pre-wrap">'+esc(c.notas)+'</div>':'')+
     '<div class="note" style="margin-top:6px">Criado: '+esc(fmt(c.criado))+'</div></div>';
  // estado rápido
  if(vendedor(c)) h+=angBloco(c);
  h+='<label>Mudar estado</label><select onchange="setEstado(\''+c.id+'\',this.value)">'+opts(ESTADOS,c.estado)+'</select>';
  // agendamentos
  h+='<h3>Agendamentos</h3>';
  var ags=(c.ag||[]).slice().sort(function(a,b){ if(a.feito!==b.feito) return a.feito?1:-1; return a.d<b.d?-1:1; });
  if(semAg(c)) h+='<div class="card" style="border-color:#F3B9C4;color:var(--red);font-weight:600">⚠️ Este contacto não tem próximo passo marcado.</div>';
  for(var i=0;i<ags.length;i++) h+=apCard(c, ags[i], false);
  h+='<button class="btn gold full" onclick="newAp(\''+c.id+'\')">+ Novo agendamento</button>';
  // histórico
  h+='<h3>Histórico de interações</h3>';
  h+='<button class="btn full" style="margin-bottom:10px" onclick="openAudio(\''+c.id+'\')">🎙️ Nota de áudio (IA resume e agenda)</button>';
  h+='<div class="g2"><div><select id="hcanal">'+opts(['Chamada','WhatsApp','Email','Visita','Reunião','Presencial','Nota'],'Chamada')+'</select></div></div>';
  h+='<textarea id="htxt" placeholder="O que foi falado / combinado…" style="margin-top:8px"></textarea>';
  h+='<button class="btn full" style="margin-top:8px" onclick="addHist(\''+c.id+'\')">Registar interação</button>';
  var hs=(c.hist||[]).slice().reverse();
  for(i=0;i<hs.length;i++) h+='<div class="hist"><b>'+esc(fmt(hs[i].d))+' · '+esc(hs[i].canal)+'</b><div style="white-space:pre-wrap">'+esc(hs[i].txt)+'</div></div>';
  h+='<div style="margin-top:24px"><button class="btn red full" onclick="delContact(\''+c.id+'\')">Apagar contacto</button></div>';
  openModal(h);
}
function setEstado(id, e){
  var c=byId(id); c.estado=e;
  c.hist=c.hist||[]; c.hist.push({d:nowLocal(), canal:'Nota', txt:'Estado alterado para: '+e});
  save(c); render();
  if(e==='Angariado / Fechado' && vendedor(c) && !c.ang){ toast('Registe o contrato de angariação'); angForm(id); return; }
  if(!isClosed(c) && !nextAp(c)){ toast('Marque o próximo passo'); newAp(id, true); } else openContact(id);
}
function addHist(id){
  var t=v('htxt'); if(!t){ toast('Escreva a interação'); return; }
  var c=byId(id); c.hist=c.hist||[]; c.hist.push({d:nowLocal(), canal:v('hcanal'), txt:t});
  save(c); openContact(id); toast('Interação registada');
}
function delContact(id){
  if(!confirm('Apagar este contacto definitivamente?')) return;
  for(var i=0;i<db.contacts.length;i++){ if(db.contacts[i].id===id){ db.contacts.splice(i,1); break; } }
  db.del=db.del||[]; db.del.push({id:id, upd:Date.now()});
  save(null); closeModal(); render(); toast('Contacto apagado');
}

/* ---------- FORMULÁRIO CONTACTO ---------- */
function agFields(a, obrig){
  a=a||{d:addDays(1,'10:00'), tipo:'Ligar', nota:''};
  var p=a.d.split('T');
  return '<div class="box"><label>Próximo passo '+(obrig?'(obrigatório)':'')+'</label>'+
    '<select id="atipo">'+opts(ACOES,a.tipo)+'</select>'+
    '<div class="g2"><div><label>Data</label><input type="date" id="adata" value="'+esc(p[0])+'"></div>'+
    '<div><label>Hora</label><input type="time" id="ahora" value="'+esc(p[1]||'10:00')+'"></div></div>'+
    '<label>Nota</label><input id="anota" value="'+esc(a.nota)+'" placeholder="Ex.: levar estudo de mercado">'+
    '<label style="display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--cream)"><input type="checkbox" id="acal" style="width:auto" checked> Adicionar também ao meu calendário</label>'+
    (obrig?'<div class="req">Todo o contacto ativo precisa de ter um próximo passo marcado.</div>':'')+
  '</div>';
}
function readAg(){
  var d=v('adata'), h=v('ahora');
  if(!d||!h) return null;
  return {id:uid(), d:d+'T'+h, tipo:v('atipo'), nota:v('anota'), feito:false};
}
var pendingLead=null;
function openForm(id, preset){
  var c=id?byId(id):null; var novo=!c;
  if(!preset) pendingLead=null;
  c=c||preset||{nome:'',tel:'',email:'',tipo:'Proprietário (venda)',origem:'OLX',zona:'Alfragide',estado:'Novo',interesse:'',orcamento:'',notas:''};
  var h='<div class="sheet-h"><h2>'+(novo?'Novo contacto':'Editar contacto')+'</h2><button class="x" onclick="closeModal()">×</button></div>';
  h+='<label>Nome *</label><input id="fnome" value="'+esc(c.nome)+'" placeholder="Nome do contacto">';
  h+='<div class="g2"><div><label>Telemóvel</label><input id="ftel" type="tel" value="'+esc(c.tel)+'" placeholder="912 345 678"></div>'+
     '<div><label>Email</label><input id="femail" type="email" value="'+esc(c.email)+'"></div></div>';
  h+='<div class="g2"><div><label>Tipo</label><select id="ftipo">'+opts(TIPOS,c.tipo)+'</select></div>'+
     '<div><label>Origem</label><select id="forigem">'+opts(ORIGENS,c.origem)+'</select></div></div>';
  h+='<div class="g2"><div><label>Zona</label><select id="fzona">'+opts(ZONAS,c.zona)+'</select></div>'+
     '<div><label>Estado</label><select id="festado">'+opts(ESTADOS,c.estado)+'</select></div></div>';
  h+='<label>Imóvel / o que procura</label><input id="finteresse" value="'+esc(c.interesse)+'" placeholder="Ex.: T2 em Queluz · Moradia T3+ Oeiras">';
  h+='<label>Valor (€) — preço do imóvel ou orçamento</label><input id="forc" type="number" inputmode="numeric" value="'+esc(c.orcamento)+'">';
  h+='<label>Notas</label><textarea id="fnotas">'+esc(c.notas)+'</textarea>';
  if(novo) h+=agFields(null, true);
  h+='<button class="btn gold full" style="margin-top:16px" onclick="saveForm('+(novo?'null':'\''+id+'\'')+')">Guardar</button>';
  openModal(h);
}
function saveForm(id){
  var nome=v('fnome'); if(!nome){ toast('O nome é obrigatório'); return; }
  var c=id?byId(id):{id:uid(), criado:nowLocal(), hist:[], ag:[]};
  c.nome=nome; c.tel=v('ftel'); c.email=v('femail'); c.tipo=v('ftipo'); c.origem=v('forigem');
  c.zona=v('fzona'); c.estado=v('festado'); c.interesse=v('finteresse'); c.orcamento=v('forc'); c.notas=v('fnotas');
  var addCal=false, a=null;
  if(!id){
    a=readAg();
    if(!a && !isClosed(c)){ toast('Marque a data e hora do próximo passo'); return; }
    if(a){ c.ag.push(a); addCal=document.getElementById('acal').checked; }
    c.hist.push({d:nowLocal(), canal:'Nota', txt:'Contacto criado ('+c.origem+')'});
    db.contacts.push(c);
    if(pendingLead){ markLead(pendingLead); pendingLead=null; }
  }
  save(c); render(); openContact(c.id); toast('Guardado');
  if(addCal && a) askCal(c.id, a.id);
}

/* ---------- AGENDAMENTOS ---------- */
function newAp(cid, obrig){
  var c=byId(cid);
  var h='<div class="sheet-h"><h2>Agendar · '+esc(c.nome)+'</h2><button class="x" onclick="'+(obrig?'toast(\'Marque o próximo passo\')':'openContact(\''+cid+'\')')+'">×</button></div>';
  h+=agFields(null, obrig);
  h+='<button class="btn gold full" style="margin-top:16px" onclick="saveAp(\''+cid+'\')">Guardar agendamento</button>';
  if(obrig) h+='<button class="btn ghost full" style="margin-top:8px" onclick="setEstadoClose(\''+cid+'\')">Não há próximo passo → marcar como Perdido</button>';
  openModal(h);
}
function setEstadoClose(cid){ var c=byId(cid); c.estado='Perdido'; c.hist.push({d:nowLocal(),canal:'Nota',txt:'Marcado como Perdido'}); save(c); render(); openContact(cid); }
function saveAp(cid){
  var a=readAg(); if(!a){ toast('Escolha data e hora'); return; }
  var c=byId(cid); c.ag=c.ag||[]; c.ag.push(a);
  var addCal=document.getElementById('acal').checked;
  save(c); render(); openContact(cid); toast('Agendado: '+fmt(a.d));
  if(addCal) askCal(cid, a.id);
}
function findAp(c, aid){ for(var i=0;i<c.ag.length;i++){ if(c.ag[i].id===aid) return c.ag[i]; } return null; }
function editAp(cid, aid){
  var c=byId(cid), a=findAp(c,aid);
  var h='<div class="sheet-h"><h2>Editar agendamento</h2><button class="x" onclick="openContact(\''+cid+'\')">×</button></div>';
  h+=agFields(a,false);
  h+='<button class="btn gold full" style="margin-top:16px" onclick="saveEditAp(\''+cid+'\',\''+aid+'\')">Guardar</button>';
  h+='<button class="btn red full" style="margin-top:8px" onclick="delAp(\''+cid+'\',\''+aid+'\')">Apagar agendamento</button>';
  openModal(h);
}
function saveEditAp(cid, aid){
  var n=readAg(); if(!n){ toast('Escolha data e hora'); return; }
  var c=byId(cid), a=findAp(c,aid); a.d=n.d; a.tipo=n.tipo; a.nota=n.nota;
  var addCal=document.getElementById('acal').checked;
  save(c); render(); openContact(cid); toast('Atualizado');
  if(addCal) askCal(cid, aid);
}
function delAp(cid, aid){
  var c=byId(cid);
  for(var i=0;i<c.ag.length;i++){ if(c.ag[i].id===aid){ c.ag.splice(i,1); break; } }
  save(c); render();
  if(!isClosed(c) && !nextAp(c)) newAp(cid,true); else openContact(cid);
}
function doneAp(cid, aid){
  var c=byId(cid), a=findAp(c,aid);
  var res=prompt('Resultado de "'+a.tipo+'" (opcional):','');
  if(res===null) return;
  a.feito=true; a.res=res;
  c.hist=c.hist||[]; c.hist.push({d:nowLocal(), canal:a.tipo, txt:'✓ '+a.tipo+(res?' — '+res:'')});
  save(c); render();
  if(!isClosed(c) && !nextAp(c)){ toast('Qual é o próximo passo?'); newAp(cid, true); }
  else if(document.getElementById('modal').className.indexOf('open')>-1) openContact(cid);
}

/* ---------- CALENDÁRIO ---------- */
function dt(s, addMin){ var d=parseL(s); if(addMin) d=new Date(d.getTime()+addMin*60000);
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00'; }
function evTitle(c,a){ return a.tipo+' · '+c.nome; }
function evDesc(c,a){
  var t=[]; if(a.nota) t.push(a.nota); if(c.interesse) t.push('Imóvel: '+c.interesse);
  if(c.tel) t.push('Tel: '+c.tel); if(c.estado) t.push('Estado: '+c.estado); t.push('— CRM Josimar Souza');
  return t.join('\n');
}
function askCal(cid, aid){
  var c=byId(cid), a=findAp(c,aid);
  var h='<div class="sheet-h"><h2>Adicionar ao calendário</h2><button class="x" onclick="openContact(\''+cid+'\')">×</button></div>';
  h+='<div class="card"><b>'+esc(evTitle(c,a))+'</b><div class="sub">'+esc(fmt(a.d))+'</div></div>';
  h+='<button class="btn gold full" onclick="ics(\''+cid+'\',\''+aid+'\')">📱 Calendário do iPhone</button>';
  h+='<button class="btn full" style="margin-top:8px" onclick="gcal(\''+cid+'\',\''+aid+'\')">📅 Google Agenda</button>';
  h+='<button class="btn ghost full" style="margin-top:8px" onclick="openContact(\''+cid+'\')">Agora não</button>';
  openModal(h);
}
function gcal(cid, aid){
  var c=byId(cid), a=findAp(c,aid);
  var url='https://calendar.google.com/calendar/render?action=TEMPLATE'+
    '&text='+encodeURIComponent(evTitle(c,a))+
    '&dates='+dt(a.d)+'/'+dt(a.d,60)+
    '&ctz=Europe/Lisbon'+
    '&details='+encodeURIComponent(evDesc(c,a))+
    (c.zona&&c.zona!=='Outra'?'&location='+encodeURIComponent(c.zona):'');
  window.open(url,'_blank');
}
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function ics(cid, aid){
  var c=byId(cid), a=findAp(c,aid);
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CRM Josimar Souza//PT','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT','UID:'+a.id+'@crm-josimar','DTSTAMP:'+dt(nowLocal()),
    'DTSTART:'+dt(a.d),'DTEND:'+dt(a.d,60),

function download(text, name, type){

  var url=(window.URL||window.webkitURL).createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=name; a.target='_blank';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); (window.URL||window.webkitURL).revokeObjectURL(url); }, 1500);
}

function xhr(method, url, headers, body, cb){

function withToken(cb){

/* ---------- Sincronização (o mais recente ganha, contacto a contacto) ---------- */
function scheduleSync(){
  if(!sess) return;
  clearTimeout(syncT); syncT=setTimeout(function(){ sync(false); }, 1500);
}
function rowOf(c){ return {id:c.id, data:c, upd:c.upd||0, deleted:false}; }
function idxOf(id){ for(var i=0;i<db.contacts.length;i++){ if(db.contacts[i].id===id) return i; } return -1; }
function syncEnd(ok, manual){
  syncing=false;
  if(ok){ lastSync=new Date(); setCloud('ok'); if(manual) toast('Sincronizado'); }
  else { setCloud('err'); if(manual) toast('Falha na sincronização'); }
  if(cur==='mais' && sess) render();
  if(syncAgain){ syncAgain=false; scheduleSync(); }
}
function sync(manual){
  if(!sess){ if(manual) toast('Entre na conta primeiro'); return; }
  if(syncing){ syncAgain=true; return; }
  syncing=true; setCloud('busy');
  rest('GET','/rest/v1/crm_contacts?select=id,data,upd,deleted',null,null,function(st,rows){
    if(st!==200 || !rows || !rows.length && rows.length!==0){ syncEnd(false,manual); return; }
    var i, changed=false, push=[], remote={}, delMap={};
    db.del=db.del||[];
    for(i=0;i<rows.length;i++) remote[rows[i].id]=rows[i];
    for(i=0;i<db.del.length;i++) delMap[db.del[i].id]=db.del[i].upd;
    // primeiro arranque num 2.º aparelho: os exemplos iniciais não tocados não sobem
    if(rows.length){
      for(i=db.contacts.length-1;i>=0;i--){
        var s=db.contacts[i];
        if(String(s.id).indexOf('seed-')===0 && s.upd===1 && !remote[s.id]){ db.contacts.splice(i,1); changed=true; }
      }
    }
    for(var id in remote){ if(!remote.hasOwnProperty(id)) continue;
      var r=remote[id], li=idxOf(id), l=li>-1?db.contacts[li]:null, ru=Number(r.upd)||0;
      if(delMap[id]!==undefined){
        if(r.deleted || delMap[id]>=ru){ if(!r.deleted) push.push({id:id,data:{},upd:delMap[id],deleted:true}); continue; }
      }
      if(r.deleted){
        if(l && (l.upd||0)<=ru){ db.contacts.splice(li,1); changed=true; }
        else if(l) push.push(rowOf(l));
        continue;
      }
      if(!l){ r.data.id=id; r.data.upd=ru; db.contacts.push(r.data); changed=true; }
      else if(ru>(l.upd||0)){ r.data.id=id; r.data.upd=ru; db.contacts[li]=r.data; changed=true; }
      else if((l.upd||0)>ru) push.push(rowOf(l));
    }
    for(i=0;i<db.contacts.length;i++){ if(!remote[db.contacts[i].id]) push.push(rowOf(db.contacts[i])); }
    function done(ok){
      if(ok) db.del=[];
      if(changed || ok) saveLocal();
      if(changed && document.getElementById('modal').className.indexOf('open')<0) render();
      syncEnd(ok, manual);
    }
    if(!push.length){ done(true); return; }
    rest('POST','/rest/v1/crm_contacts?on_conflict=id',JSON.stringify(push),'resolution=merge-duplicates,return=minimal',function(st2){
      done(st2>=200 && st2<300);
    });
  });
}

var ANG_EST=['Ativa','Vendido','Terminada'];
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dDate(s){ if(!s) return null; var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function dFmt(s){ var d=dDate(s); return d? d.getDate()+' '+MESES[d.getMonth()]+' '+d.getFullYear() : '—'; }
function diasAte(s){ var d=dDate(s); if(!d) return null; var h=new Date(); h.setHours(0,0,0,0); return Math.round((d-h)/86400000); }
function addMeses(s,n){ var d=dDate(s); if(!d) return ''; var dia=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); var ult=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(dia,ult)); d.setDate(d.getDate()-1); return ymd(d); }
function eur(n){ return Math.round(Number(n)||0).toLocaleString('pt-PT')+' €'; }
function comAg(a){ return (Number(a.preco)||0)*(Number(a.pct)||0)/100; }
function comMinha(a){ var c=comAg(a); return a.minha!==''&&a.minha!=null&&!isNaN(Number(a.minha)) ? c*Number(a.minha)/100 : c; }
function contratosAlerta(){
  var out=[], i, c, d;
  for(i=0;i<db.contacts.length;i++){ c=db.contacts[i];
    if(!c.ang || c.ang.estado!=='Ativa' || !c.ang.fim) continue;
    d=diasAte(c.ang.fim); if(d!==null && d<=15) out.push(c); }
  out.sort(function(a,b){ return a.ang.fim<b.ang.fim?-1:1; });
  return out;
}
function angTag(a){
  if(a.estado==='Vendido') return '<span class="tag green">Vendido</span>';
  if(a.estado==='Terminada') return '<span class="tag">Terminada</span>';
  var d=diasAte(a.fim);
  if(d===null) return '<span class="tag gold">Ativa</span>';
  if(d<0) return '<span class="tag red">Terminou há '+(-d)+(d===-1?' dia':' dias')+'</span>';
  if(d<=15) return '<span class="tag red">Termina em '+d+(d===1?' dia':' dias')+'</span>';
  return '<span class="tag gold">Ativa · '+d+' dias</span>';
}
function angCard(c){
  var a=c.ang;
  return '<div class="card tap" onclick="openContact(\''+c.id+'\')"><div class="row"><div class="av">'+esc(initials(c.nome))+'</div>'+
    '<div class="grow"><div class="name">'+esc(c.nome)+'</div><div class="sub">'+esc(c.interesse||'')+'</div></div>'+
    '<div class="when">'+eur(comMinha(a))+'<div class="sub" style="text-align:right">comissão</div></div></div>'+
    '<div>'+angTag(a)+'<span class="tag">'+(a.excl?'Exclusivo':'Não exclusivo')+'</span>'+(a.fim?'<span class="tag">até '+esc(dFmt(a.fim))+'</span>':'')+'</div></div>';
}
function angResumo(){
  var n=0, tot=0, i, c;
  for(i=0;i<db.contacts.length;i++){ c=db.contacts[i]; if(c.ang && c.ang.estado==='Ativa'){ n++; tot+=comMinha(c.ang); } }
  if(!n) return '';
  return '<div class="stats" style="cursor:pointer" onclick="go(\'ang\')"><div class="stat"><b>'+n+'</b><span>Angariações ativas</span></div><div class="stat"><b style="font-size:20px">'+eur(tot)+'</b><span>Comissão prevista ›</span></div></div>';
}
function angBloco(c){
  var a=c.ang, q="'"+c.id+"'";
  var h='<h3>Contrato de angariação</h3>';
  if(!a) return h+'<button class="btn ghost full" onclick="angForm('+q+')">＋ Registar contrato de angariação</button>';
  var mp=(a.minha!==''&&a.minha!=null);
  h+='<div class="card">'+'<div>'+angTag(a)+'<span class="tag">'+(a.excl?'Exclusivo':'Não exclusivo')+'</span></div>'+
     '<div style="margin-top:8px"><b>Período:</b> '+esc(dFmt(a.ini))+' → '+esc(dFmt(a.fim))+'</div>'+
     (a.preco?'<div><b>Preço angariado:</b> '+eur(a.preco)+'</div>':'')+
     (a.pct?'<div><b>Comissão '+esc(a.pct)+'%:</b> '+eur(comAg(a))+' <span class="note">+ IVA</span></div>':'')+
     (mp?'<div><b>A minha parte ('+esc(a.minha)+'%):</b> '+eur(comMinha(a))+'</div>':'')+
     (a.nota?'<div class="note" style="margin-top:6px;white-space:pre-wrap">'+esc(a.nota)+'</div>':'')+
     '<div class="btns" style="margin-top:10px"><button class="btn ghost sm" onclick="angForm('+q+')">Editar contrato</button>'+
     (a.estado==='Ativa'?'<button class="btn gold sm" onclick="angVendido('+q+')">✓ Vendido</button>':'')+'</div></div>';
  return h;
}
function angForm(cid){
  var c=byId(cid); if(!c) return; var q="'"+cid+"'";
  var a=c.ang||{estado:'Ativa', excl:true, ini:ymd(new Date()), meses:'6', fim:addMeses(ymd(new Date()),6), preco:c.orcamento||'', pct:'5', minha:'', nota:''};
  var h='<div class="sheet-h"><h2>Contrato de angariação</h2><button class="x" onclick="openContact('+q+')">×</button></div>';
  h+='<div class="note">'+esc(c.nome)+(c.interesse?' · '+esc(c.interesse):'')+'</div>';
  h+='<div class="g2"><div><label>Estado</label><select id="gest">'+opts(ANG_EST,a.estado)+'</select></div>'+
     '<div><label>Exclusividade</label><select id="gexc">'+opts(['Exclusivo','Não exclusivo'],a.excl?'Exclusivo':'Não exclusivo')+'</select></div></div>';
  h+='<div class="g2"><div><label>Início</label><input type="date" id="gini" value="'+esc(a.ini)+'" onchange="angCalc()"></div>'+
     '<div><label>Duração</label><select id="gmes" onchange="angCalc()">'+opts(['3','4','6','9','12','Outra'],String(a.meses||'Outra'))+'</select></div></div>';
  h+='<label>Fim do contrato</label><input type="date" id="gfim" value="'+esc(a.fim)+'" onchange="document.getElementById(\'gmes\').value=\'Outra\'">';
  h+='<label>Preço angariado (€)</label><input id="gpre" type="number" inputmode="numeric" value="'+esc(a.preco)+'" oninput="angCalc(1)">';
  h+='<div class="g2"><div><label>Comissão (%)</label><input id="gpct" type="number" inputmode="decimal" step="0.1" value="'+esc(a.pct)+'" oninput="angCalc(1)"></div>'+
     '<div><label>A minha parte (%)</label><input id="gmin" type="number" inputmode="decimal" step="1" placeholder="opcional" value="'+esc(a.minha)+'" oninput="angCalc(1)"></div></div>';
  h+='<div class="card" id="gres" style="margin-top:10px"></div>';
  h+='<label>Notas do contrato</label><textarea id="gnot" placeholder="Ex.: CMI n.º …, condições especiais">'+esc(a.nota)+'</textarea>';
  h+='<div class="note" style="margin-top:8px">Com o contrato ativo, a app marca sozinha um lembrete 15 dias antes do fim para tratar da renovação.</div>';
  h+='<button class="btn gold full" style="margin-top:14px" onclick="angSave('+q+')">Guardar contrato</button>';
  if(c.ang) h+='<button class="btn red full" style="margin-top:8px" onclick="angDel('+q+')">Apagar contrato</button>';
  openModal(h); angCalc(1);
}
function angCalc(soValor){
  if(!soValor){ var m=v('gmes'); if(m!=='Outra' && v('gini')) document.getElementById('gfim').value=addMeses(v('gini'),+m); }
  var a={preco:v('gpre'), pct:v('gpct'), minha:v('gmin')}, r=document.getElementById('gres'); if(!r) return;
  r.innerHTML = a.preco&&a.pct ? '<b>Comissão:</b> '+eur(comAg(a))+' <span class="note">+ IVA</span>'+(a.minha!==''?'<br><b>A minha parte:</b> '+eur(comMinha(a)):'') : '<span class="note">Indique o preço e a comissão para ver o valor.</span>';
}
function findAg(c,id){ if(!id) return null; for(var i=0;i<(c.ag||[]).length;i++){ if(c.ag[i].id===id) return c.ag[i]; } return null; }
function dropRenov(c){
  var a=c.ang; if(!a||!a.agId) return;
  for(var i=0;i<(c.ag||[]).length;i++){ if(c.ag[i].id===a.agId && !c.ag[i].feito){ c.ag.splice(i,1); break; } }
  a.agId=null;
}
function syncRenov(c){
  var a=c.ang; c.ag=c.ag||[];
  if(a.estado!=='Ativa' || !a.fim){ dropRenov(c); return null; }
  var d=dDate(a.fim); d.setDate(d.getDate()-15);
  var amanha=new Date(); amanha.setDate(amanha.getDate()+1); amanha.setHours(0,0,0,0);
  if(diasAte(a.fim)<0){ d=amanha; } else if(d<amanha){ d=amanha; }
  var when=ymd(d)+'T10:00', nota='Renovar contrato de angariação (termina a '+dFmt(a.fim)+')';
  var ap=findAg(c,a.agId);
  if(ap && !ap.feito){ ap.d=when; ap.nota=nota; return ap; }
  ap={id:uid(), d:when, tipo:'Follow-up', nota:nota, feito:false}; c.ag.push(ap); a.agId=ap.id; return ap;
}
function angSave(cid){
  var c=byId(cid); if(!c) return;
  var ini=v('gini'), fim=v('gfim');
  if(!ini||!fim){ toast('Indique o início e o fim'); return; }
  if(fim<ini){ toast('O fim tem de ser depois do início'); return; }
  var novo=!c.ang, old=c.ang||{};
  c.ang={estado:v('gest'), excl:v('gexc')==='Exclusivo', ini:ini, fim:fim, meses:v('gmes'), preco:v('gpre'), pct:v('gpct'), minha:v('gmin'), nota:v('gnot'), agId:old.agId||null, vendidoEm:old.vendidoEm||null};
  if(c.ang.estado==='Vendido' && !c.ang.vendidoEm) c.ang.vendidoEm=ymd(new Date());
  if(c.ang.estado!=='Terminada') c.estado='Angariado / Fechado';
  var ap=syncRenov(c);
  c.hist=c.hist||[]; c.hist.push({d:nowLocal(), canal:'Nota', txt:(novo?'Contrato de angariação registado':'Contrato de angariação atualizado')+' — '+c.ang.estado+', '+(c.ang.excl?'exclusivo':'não exclusivo')+', até '+dFmt(fim)+(c.ang.preco?', '+eur(c.ang.preco):'')});
  if(c.ang.estado==='Terminada' && c.estado==='Angariado / Fechado') c.estado='Nutrir';
  save(c); render();
  if(!isClosed(c) && !nextAp(c)){ toast('Marque o próximo passo'); newAp(cid,true); return; }
  if(ap && novo){ toast('Lembrete de renovação marcado para '+fmt(ap.d)); askCal(cid, ap.id); return; }
  openContact(cid); toast('Contrato guardado');
}
function angVendido(cid){
  var c=byId(cid); if(!c||!c.ang) return;
  if(!confirm('Marcar o imóvel de '+c.nome+' como vendido?')) return;
  c.ang.estado='Vendido'; c.ang.vendidoEm=ymd(new Date()); dropRenov(c); c.estado='Angariado / Fechado';
  c.hist=c.hist||[]; c.hist.push({d:nowLocal(), canal:'Nota', txt:'🎉 Imóvel vendido — comissão '+eur(comMinha(c.ang))});
  save(c); render(); openContact(cid); toast('Parabéns pela venda! 🎉');
}
function angDel(cid){
  var c=byId(cid); if(!c||!c.ang) return;
  if(!confirm('Apagar o registo do contrato?')) return;
  dropRenov(c); delete c.ang;
  c.hist=c.hist||[]; c.hist.push({d:nowLocal(), canal:'Nota', txt:'Registo do contrato de angariação apagado'});
  save(c); render();
  if(!isClosed(c) && !nextAp(c)) newAp(cid,true); else openContact(cid);
}
function vAng(){
  var at=[], vd=[], tm=[], i, c, prev=0, ano=0, y=String(new Date().getFullYear()), ex=0;
  for(i=0;i<db.contacts.length;i++){ c=db.contacts[i]; if(!c.ang) continue;
    if(c.ang.estado==='Ativa'){ at.push(c); prev+=comMinha(c.ang); if(c.ang.excl) ex++; }
    else if(c.ang.estado==='Vendido'){ vd.push(c); if(String(c.ang.vendidoEm||'').indexOf(y)===0) ano+=comMinha(c.ang); }
    else tm.push(c); }
  at.sort(function(a,b){ return a.ang.fim<b.ang.fim?-1:1; });
  vd.sort(function(a,b){ return (a.ang.vendidoEm||'')>(b.ang.vendidoEm||'')?-1:1; });
  var h='<h2>Contratos e comissões</h2>';
  h+='<div class="stats"><div class="stat"><b>'+at.length+'</b><span>Ativas · '+ex+' excl.</span></div><div class="stat"><b style="font-size:19px">'+eur(prev)+'</b><span>Prevista</span></div><div class="stat"><b style="font-size:19px">'+eur(ano)+'</b><span>Vendido '+y+'</span></div></div>';
  h+='<div class="note">Valores sem IVA. Se indicar “a minha parte (%)” num contrato, conta só a sua parte; senão conta a comissão total.</div>';
  h+='<h3>Ativas</h3>'; if(!at.length) h+='<div class="empty">Ainda não há contratos ativos. Registe-os na ficha de cada proprietário.</div>';
  for(i=0;i<at.length;i++) h+=angCard(at[i]);
  if(vd.length){ h+='<h3>Vendidas</h3>'; for(i=0;i<vd.length;i++) h+=angCard(vd[i]); }
  if(tm.length){ h+='<h3>Terminadas</h3>'; for(i=0;i<tm.length;i++) h+=angCard(tm[i]); }
  return h;
}

function saud(){ var h=new Date().getHours(); return h<12?'bom dia':(h<20?'boa tarde':'boa noite'); }
function ola(c){
  var n=String(c.nome||'').replace(/^\s+/,'').split(/\s+/)[0]||'';
  if(/^(propriet|client|senhori|contact|lead)/i.test(n)) n='';
  return 'Olá'+(n?' '+n:'')+', '+saud()+'!';
}
function vendedor(c){ return c.tipo==='Proprietário (venda)' || c.tipo==='Senhorio (arrendar)'; }
function imv(c){ return c.interesse?' ('+c.interesse+')':''; }
var EU='Josimar Souza, consultor imobiliário da Imotrust';
var TPLS=[
  {id:'p1', t:'1.º contacto', v:1, f:function(c){ return ola(c)+' Sou o '+EU+(c.zona&&c.zona!=='Outra'?', e trabalho a zona de '+c.zona:'')+'. Vi o seu anúncio'+imv(c)+' e gostava de saber se ainda está disponível. Faço uma avaliação gratuita e sem compromisso, para confirmar se o preço está alinhado com o que se está a vender na zona. Posso ligar-lhe para falarmos 5 minutos?'; }},
  {id:'p2', t:'Pedir reunião', v:1, f:function(c){ return ola(c)+' Fala o Josimar Souza, da Imotrust. Gostava de marcar uma reunião de 20 minutos para lhe apresentar o estudo de mercado do seu imóvel'+imv(c)+' e o plano que proponho. Que dia e hora lhe dão mais jeito esta semana?'; }},
  {id:'c1', t:'Enviar imóveis', v:0, f:function(c){ return ola(c)+' Selecionei alguns imóveis que encaixam no que procura'+imv(c)+'. Envio os links a seguir. Diga-me quais gostava de visitar e eu trato da marcação.'; }},
  {id:'x1', t:'Confirmar marcação', v:2, f:function(c){ var a=nextAp(c); return ola(c)+' Confirmo '+(a?'a nossa marcação ('+a.tipo.toLowerCase()+') para '+fmt(a.d).replace(' · ',' às ').replace(/^(Hoje|Amanhã) /,function(m){return m.toLowerCase()+'às ';}):'a nossa marcação para [dia e hora]')+'. Se precisar de alterar, diga-me. Até lá!'; }},
  {id:'c2', t:'Depois da visita', v:0, f:function(c){ return ola(c)+' O que achou do imóvel que visitámos? Gostava de saber o que mais gostou e o que não encaixa, para afinar a procura. Se quiser, envio-lhe mais opções.'; }},
  {id:'p3', t:'Depois da reunião', v:1, f:function(c){ return ola(c)+' Obrigado pelo tempo na nossa reunião. Fico a aguardar a sua decisão sobre a proposta que lhe apresentei. Se tiver alguma dúvida, estou à disposição.'; }},
  {id:'x2', t:'Retomar contacto', v:2, f:function(c){ return ola(c)+' Fala o Josimar Souza, da Imotrust. Já passou algum tempo desde a nossa última conversa e queria saber como está '+(vendedor(c)?'a situação do imóvel':'a procura de casa')+'. Posso ajudar em alguma coisa?'; }}
];
function tplsFor(c){
  var want=vendedor(c)?1:0, a=[], b=[], i;
  for(i=0;i<TPLS.length;i++){ if(TPLS[i].v===want || TPLS[i].v===2) a.push(TPLS[i]); else b.push(TPLS[i]); }
  return a.concat(b);
}
function openMsgs(cid, tid){
  var c=byId(cid); if(!c) return; var list=tplsFor(c), i, cur2=list[0];
  for(i=0;i<list.length;i++){ if(list[i].id===tid) cur2=list[i]; }
  var q="'"+cid+"'";
  var h='<div class="sheet-h"><h2>Mensagens prontas</h2><button class="x" onclick="openContact('+q+')">×</button></div>';
  h+='<div class="note" style="margin-bottom:8px">Para: <b>'+esc(c.nome)+'</b>'+(c.tel?' · '+esc(c.tel):' · sem telemóvel (escolhe o contacto no WhatsApp)')+'</div>';
  h+='<div class="chips" style="flex-wrap:wrap;overflow:visible">';
  for(i=0;i<list.length;i++) h+='<button class="chip '+(list[i].id===cur2.id?'on':'')+'" onclick="openMsgs('+q+',\''+list[i].id+'\')">'+esc(list[i].t)+'</button>';
  h+='</div><textarea id="mtxt" style="min-height:200px">'+esc(cur2.f(c))+'</textarea>';
  h+='<button class="btn gold full" style="margin-top:10px" onclick="sendWa('+q+',\''+cur2.id+'\')">💬 Enviar no WhatsApp</button>';
  h+='<button class="btn ghost full" style="margin-top:8px" onclick="toast(copyEl(\'mtxt\')?\'Mensagem copiada\':\'Copie o texto manualmente\')">📋 Copiar texto</button>';
  h+='<div class="note" style="margin-top:10px">Pode editar o texto antes de enviar. O envio fica registado no histórico.</div>';
  openModal(h);
}
function sendWa(cid, tid){
  var c=byId(cid), e=document.getElementById('mtxt'); if(!c||!e) return;
  var txt=e.value.replace(/^\s+|\s+$/g,''); if(!txt){ toast('Mensagem vazia'); return; }
  var nome='', i; for(i=0;i<TPLS.length;i++){ if(TPLS[i].id===tid) nome=TPLS[i].t; }
  var w=telNorm(c.tel);
  window.open('https://wa.me/'+(w||'')+'?text='+encodeURIComponent(txt),'_blank');
  c.hist=c.hist||[]; c.hist.push({d:nowLocal(), canal:'WhatsApp', txt:'Mensagem enviada: '+nome});
  save(c); openContact(cid);
}

/* ================= NOTA DE ÁUDIO (IA) ================= */
var audRes=null, rec=null, recChunks=[];
var DIAS_L=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
function qid(cid){ return cid ? "'"+cid+"'" : 'null'; }
function openAudio(cid){
  var c=cid?byId(cid):null;
  var h='<div class="sheet-h"><h2>Nota de áudio</h2><button class="x" onclick="'+(cid?'openContact('+qid(cid)+')':'closeModal()')+'">×</button></div>';
  if(!sess){
    openModal(h+'<div class="card">Para a IA transcrever e resumir os áudios, entre primeiro na sua conta.</div><button class="btn gold full" onclick="closeModal();go(\'mais\')">Entrar na conta</button>');
    return;
  }
  h+='<div class="note" style="margin-bottom:12px">'+(c?'Contacto: <b>'+esc(c.nome)+'</b>. ':'')+'A IA transcreve, separa o que é importante, guarda como nota e propõe os compromissos para a agenda. Revê tudo antes de guardar.</div>';
  h+='<input type="file" id="afile" accept="audio/*,video/mp4,.m4a,.mp3,.ogg,.opus,.wav,.webm" style="display:none" onchange="pickAudio(this,'+qid(cid)+')">';
  h+='<button class="btn gold full" onclick="document.getElementById(\'afile\').click()">📂 Carregar áudio</button>';
  if(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    h+='<button class="btn full" id="recbtn" style="margin-top:8px" onclick="recToggle('+qid(cid)+')">🎙️ Gravar agora</button>';
  h+='<label>Ou escreva / dite o texto</label><textarea id="atext" placeholder="Ex.: Falei com a proprietária, quer 285 mil pelo T2, reunião sexta às 18h…"></textarea>';
  h+='<button class="btn ghost full" style="margin-top:8px" onclick="sendText('+qid(cid)+')">Analisar texto</button>';
  h+='<div class="note" style="margin-top:12px">Áudio do WhatsApp: toque no áudio → Partilhar → Guardar em Ficheiros, e carregue-o aqui. Máx. 25 MB.</div>';
  openModal(h);
}
function pickAudio(inp, cid){
  var f=inp.files[0]; if(!f) return;
  if(f.size>25*1024*1024){ toast('Áudio demasiado grande (máx. 25 MB)'); return; }
  sendAudio(f, f.name||'audio.m4a', '', cid);
}
function sendText(cid){
  var t=v('atext'); if(!t){ toast('Escreva ou dite o texto'); return; }
  sendAudio(null, '', t, cid);
}
function recToggle(cid){
  var b=document.getElementById('recbtn');
  if(rec && rec.state==='recording'){ rec.stop(); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    recChunks=[]; rec=new MediaRecorder(stream);
    rec.ondataavailable=function(e){ if(e.data && e.data.size) recChunks.push(e.data); };
    rec.onstop=function(){
      var tr=stream.getTracks(); for(var i=0;i<tr.length;i++) tr[i].stop();
      var type=(rec.mimeType||'audio/mp4').split(';')[0];
      var ext=type.indexOf('webm')>-1?'webm':(type.indexOf('ogg')>-1?'ogg':'m4a');
      var blob=new Blob(recChunks,{type:type}); rec=null;
      if(!blob.size){ toast('Gravação vazia'); return; }
      sendAudio(blob,'gravacao.'+ext,'',cid);
    };
    rec.start();
    if(b){ b.className='btn full rec'; b.innerHTML='⏹️ Parar e analisar'; }
  })['catch'](function(){ toast('Sem acesso ao microfone'); });
}
function sendAudio(blob, name, text, cid){
  openModal('<div class="spin">🎧 A transcrever e a analisar…<div class="note" style="margin-top:8px;font-weight:400">Pode demorar alguns segundos.</div></div>');
  var fd=new FormData(), list=[], i;
  if(blob) fd.append('file', blob, name);
  if(text) fd.append('text', text);
  for(i=0;i<db.contacts.length;i++) list.push({id:db.contacts[i].id, nome:db.contacts[i].nome});
  fd.append('contacts', JSON.stringify(list));
  fd.append('now', nowLocal());
  fd.append('weekday', DIAS_L[new Date().getDay()]);
  if(cid) fd.append('contact_id', cid);
  withToken(function(t){
    if(!t){ openAudio(cid); toast('Sem ligação / sessão'); return; }
    xhr('POST', SB_URL+'/functions/v1/audio-nota', {apikey:SB_KEY, Authorization:'Bearer '+t}, fd, function(st,j){
      if(st===200 && j && !j.error){ reviewAudio(j, cid); return; }
      var e=j&&j.error, m='Não foi possível analisar o áudio';
      if(e==='sem_chave') m='A IA ainda não está ativada (falta a chave)';
      else if(e==='grande') m='Áudio demasiado grande (máx. 25 MB)';
      else if(e==='sem_acesso') m='Esta conta não tem acesso';
      else if(e==='vazio') m='Não se percebeu nada no áudio';
      else if(e==='transcricao') m='Formato de áudio não suportado';
      else if(st===0) m='Sem ligação à internet';
      openAudio(cid); toast(m);
    });
  });
}
function reviewAudio(r, cid){
  audRes=r; var i, h='<div class="sheet-h"><h2>Rever nota</h2><button class="x" onclick="closeModal()">×</button></div>';
  var sel=cid||r.contacto_id||(r.contacto_novo?'__new':'');
  var cs=db.contacts.slice().sort(function(a,b){ return a.nome.localeCompare(b.nome); });
  h+='<label>Contacto</label><select id="acont" onchange="document.getElementById(\'anew\').style.display=this.value===\'__new\'?\'block\':\'none\'">'+
     '<option value="">— escolher —</option>';
  for(i=0;i<cs.length;i++) h+='<option value="'+esc(cs[i].id)+'"'+(cs[i].id===sel?' selected':'')+'>'+esc(cs[i].nome)+'</option>';
  h+='<option value="__new"'+(sel==='__new'?' selected':'')+'>➕ Novo contacto</option></select>';
  var nn=r.contacto_novo||{nome:'',tel:''};
  h+='<div id="anew" style="display:'+(sel==='__new'?'block':'none')+'"><div class="g2"><div><label>Nome</label><input id="anome" value="'+esc(nn.nome)+'"></div><div><label>Telemóvel</label><input id="atel" type="tel" value="'+esc(nn.tel)+'"></div></div></div>';
  var txt=r.resumo||''; for(i=0;i<(r.pontos||[]).length;i++) txt+=(txt?'\n':'')+'• '+r.pontos[i];
  if(!txt) txt=r.transcricao||'';
  h+='<label>Nota (o mais importante)</label><textarea id="anotaTxt" style="min-height:150px">'+esc(txt)+'</textarea>';
  h+='<h3>Compromissos para a agenda</h3>';
  var cp=r.compromissos||[];
  if(!cp.length) h+='<div class="note">Não foi detetado nenhum compromisso com data no áudio.</div>';
  for(i=0;i<cp.length;i++){
    h+='<div class="cmp"><div class="hd"><input type="checkbox" id="ck_'+i+'" checked> <span>Adicionar à agenda</span></div>'+
       '<select id="ct_'+i+'" style="margin-top:8px">'+opts(ACOES,cp[i].tipo)+'</select>'+
       '<div class="g2" style="margin-top:8px"><div><input type="date" id="cd_'+i+'" value="'+esc(cp[i].data)+'"></div><div><input type="time" id="ch_'+i+'" value="'+esc(cp[i].hora)+'"></div></div>'+
       '<input id="cn_'+i+'" style="margin-top:8px" value="'+esc(cp[i].nota)+'" placeholder="Nota"></div>';
  }
  if(r.estado_sugerido) h+='<div class="cmp"><div class="hd"><input type="checkbox" id="cest" checked> <span>Mudar estado para “'+esc(r.estado_sugerido)+'”</span></div></div>';
  if(r.transcricao) h+='<details><summary>Ver transcrição completa</summary><div style="white-space:pre-wrap;margin-top:8px">'+esc(r.transcricao)+'</div></details>';
  h+='<button class="btn gold full" style="margin-top:16px" onclick="saveAudio()">Guardar nota e agendamentos</button>';
  openModal(h);
}
function saveAudio(){
  var r=audRes, sel=v('acont'), c, i, added=[];
  if(!sel){ toast('Escolha o contacto'); return; }
  if(sel==='__new'){
    var nome=v('anome'); if(!nome){ toast('Escreva o nome do contacto'); return; }
    c={id:uid(), criado:nowLocal(), hist:[{d:nowLocal(),canal:'Nota',txt:'Contacto criado a partir de nota de áudio'}], ag:[],
       nome:nome, tel:v('atel'), email:'', tipo:'Proprietário (venda)', origem:'Outro', zona:'Outra', estado:'Novo', interesse:'', orcamento:'', notas:''};
    db.contacts.push(c);
  } else c=byId(sel);
  if(!c) return;
  c.hist=c.hist||[]; c.ag=c.ag||[];
  var txt=v('anotaTxt'); if(txt) c.hist.push({d:nowLocal(), canal:'Áudio', txt:txt});
  for(i=0;i<(r.compromissos||[]).length;i++){
    if(!document.getElementById('ck_'+i).checked) continue;
    var d=v('cd_'+i), hh=v('ch_'+i); if(!d||!hh) continue;
    var a={id:uid(), d:d+'T'+hh, tipo:v('ct_'+i), nota:v('cn_'+i), feito:false};
    c.ag.push(a); added.push(a);
  }
  var ce=document.getElementById('cest'); if(ce && ce.checked) c.estado=r.estado_sugerido;
  save(c); render();
  if(!isClosed(c) && !nextAp(c)){ newAp(c.id,true); toast('Nota guardada — marque o próximo passo'); }
  else if(added.length===1){ askCal(c.id, added[0].id); toast('Nota e agendamento guardados'); }
  else { openContact(c.id); toast(added.length?('Nota + '+added.length+' agendamentos guardados'):'Nota guardada'); }
}

render();
setCloud(sess?'ok':'');
if(sess) sync(false);
document.addEventListener('visibilitychange', function(){ if(!document.hidden && sess) sync(false); });
</script>
